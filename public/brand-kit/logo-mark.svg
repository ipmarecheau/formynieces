<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SmoothSeas mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0a5c68"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b71e"/>
      <stop offset="1" stop-color="#e08a0b"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- foam waves -->
  <path d="M28 196c18 0 18-12 36-12s18 12 36 12 18-12 36-12 18 12 36 12 18-12 36-12" stroke="#e6f2fb" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M28 216c18 0 18-12 36-12s18 12 36 12 18-12 36-12 18 12 36 12 18-12 36-12" stroke="#e6f2fb" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- turtle -->
  <g>
    <!-- flippers -->
    <ellipse cx="70" cy="86" rx="20" ry="12" fill="#0d9488" transform="rotate(-35 70 86)"/>
    <ellipse cx="186" cy="86" rx="20" ry="12" fill="#0d9488" transform="rotate(35 186 86)"/>
    <ellipse cx="74" cy="150" rx="18" ry="11" fill="#0d9488" transform="rotate(30 74 150)"/>
    <ellipse cx="182" cy="150" rx="18" ry="11" fill="#0d9488" transform="rotate(-30 182 150)"/>
    <!-- head -->
    <circle cx="128" cy="70" r="20" fill="#0d9488"/>
    <circle cx="121" cy="66" r="3.4" fill="#06242e"/>
    <circle cx="135" cy="66" r="3.4" fill="#06242e"/>
    <!-- shell -->
    <ellipse cx="128" cy="128" rx="58" ry="50" fill="url(#shell)" stroke="#b4700a" stroke-width="3"/>
    <!-- shell segments -->
    <path d="M128 82v92M78 110l100 36M178 110L78 146" stroke="#b4700a" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="128" cy="128" r="15" fill="#fff6df" stroke="#b4700a" stroke-width="3"/>
  </g>
</svg>
