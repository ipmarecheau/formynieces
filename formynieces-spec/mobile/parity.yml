# Mobile Parity Matrix — the authoritative list of web surfaces and their mobile status.
#
# Drives `php artisan mobile:parity-audit`, which checks each item for:
#   - api:     the /api/mobile route exists (by route name)
#   - flutter: the Flutter screen file exists (path under mobile/)
#   - tests:   a Pest test file exists (tests/Feature/Api/<tests>.php)
# and renders PARITY_MATRIX.md. Add a row per web feature/screen so nothing is missed.
#
# status is advisory (what we intend); the audit computes the REAL state from the checks.

child:
  - key: login
    title: Child sign-in (parent-created creds / handoff)
    web_route: /login
    backend: AuthController (Sanctum)
    api: api.mobile.login
    flutter: smoothseas_child/lib/screens/login_screen.dart
    tests: MobileAuthTest

  - key: voyage
    title: Voyage overworld — painted map + islands list + streak + Smooth
    web_route: /voyage
    backend: VoyageController@overworld, AdventureMapBuilder
    api: api.mobile.child.voyage
    flutter: smoothseas_child/lib/screens/voyage_screen.dart
    tests: MobileChildTest

  - key: island
    title: Island interior — painted map + gated level stops
    web_route: /voyage/{island}
    backend: VoyageController@island, VoyageInteriors
    api: api.mobile.child.island
    flutter: smoothseas_child/lib/screens/island_screen.dart
    tests: MobileChildTest

  - key: lesson
    title: Lesson stage — interactive teaching blocks (LE-01/07..10)
    web_route: /practice/{module}/lesson
    backend: LessonWalk, LessonBlockSchema
    api: api.mobile.child.lesson
    flutter: smoothseas_child/lib/screens/lesson_screen.dart
    tests: MobileChildTest

  - key: practice
    title: Practice session — D1→D3→D5 climb, two tries, feedback (LL/PR)
    web_route: /practice/{module}
    backend: PracticeWalk, RecordPracticeAttempt
    api: api.mobile.child.practice.start
    flutter: smoothseas_child/lib/screens/practice_screen.dart
    tests: MobileChildTest

  - key: result
    title: Practice result — accuracy, celebration, streak (CE-02/03/05)
    web_route: (state of practice)
    backend: PracticeWalk celebrations
    api: api.mobile.child.practice.finish
    flutter: smoothseas_child/lib/screens/result_screen.dart
    tests: MobileChildTest

  - key: captains_orders
    title: Captain's Orders — Orders/Locker/Logs/Journal (CO/SE/SL)
    web_route: (sidebar on /voyage)
    backend: DailyPlanComposer, StreakEconomyService
    api: api.mobile.child.captains-orders
    flutter: smoothseas_child/lib/screens/captains_orders_sheet.dart
    tests: MobileChildTest

  # ---- not yet built ----
