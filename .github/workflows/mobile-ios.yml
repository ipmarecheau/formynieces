name: iOS build (Capacitor)

# Builds the SmoothSeas parent + child iOS apps on a macOS runner.
#
# By default it does an UNSIGNED build — it proves the apps compile on macOS with no
# Apple account required. To produce a signed .ipa / TestFlight build, add the secrets
# listed under the "signed-archive" job and flip `SIGN` to "true" (see README-ci.md).

on:
  push:
    branches: [capacitor-shell]
    paths:
      - 'mobile-parent/**'
      - 'mobile-child/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Unsigned build (${{ matrix.app }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-parent, mobile-child]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        working-directory: ${{ matrix.app }}
        run: npm ci || npm install

      - name: Sync Capacitor (iOS)
        working-directory: ${{ matrix.app }}
        run: npx cap sync ios

      - name: Resolve Swift packages
        working-directory: ${{ matrix.app }}/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build (unsigned)
        working-directory: ${{ matrix.app }}/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

  # Signed TestFlight build — runs only when the 4 Apple secrets are set.
  # Uses App Store Connect API-key AUTOMATIC (cloud-managed) signing: Xcode creates and
  # renews the distribution certificate + provisioning profiles itself, for BOTH bundle
  # ids, so there is no .p12 or .mobileprovision to export. Remove `if: false` to enable.
  signed-archive:
    name: Signed → TestFlight (${{ matrix.app }})
    if: false # ← enable once ASC_* + APPLE_TEAM_ID secrets are set (see README-ci.md)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-parent, mobile-child]
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS deps
        working-directory: ${{ matrix.app }}
        run: npm ci || npm install
      - name: Sync Capacitor (iOS)
        working-directory: ${{ matrix.app }}
        run: npx cap sync ios

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (automatic cloud signing)
        working-directory: ${{ matrix.app }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive

      - name: Export IPA (app-store)
        working-directory: ${{ matrix.app }}/ios/App
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ipa
          path: ${{ runner.temp }}/ipa/*.ipa

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/ipa/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
