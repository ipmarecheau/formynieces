name: CI & Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test suite (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Match the production image's extension set (Dockerfile). Notably GD is NOT
          # installed in prod, so disable it here (:gd) — otherwise CI diverges from prod.
          extensions: pdo_sqlite, bcmath, intl, zip, :gd
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build front-end assets (Vite manifest needed for page-render tests)
        run: |
          npm ci
          npm run build

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (Unit + Feature)
        run: php artisan test

  deploy:
    name: Deploy to VPS
    needs: test            # deploy only runs if the test gate passes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/formynieces
            git fetch origin
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh
