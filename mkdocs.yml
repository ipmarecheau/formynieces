site_name: SmoothSeas Engineering Wiki
site_description: Architecture and operations for the SmoothSeas SEA-exam platform.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
      - Overview (C4): architecture/overview.md
      - The learning loop: architecture/learning-loop.md
      - Data model: architecture/data-model.md
  - Operations:
      - Deployment & CI: operations/deployment.md
      - Environments: operations/environments.md
      - Runbooks: operations/runbooks.md
      - QA agent surface: operations/qa-agent.md
  - Reference:
      - Feature status: features/index.md
      - HTTP routes: reference/routes.md
      - Database schema: reference/schema.md
  - Contributing:
      - Development workflow: contributing/workflow.md
  - Archive: archive/index.md
