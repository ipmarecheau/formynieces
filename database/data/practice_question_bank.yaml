    sea_section: "Section I"
    prompt: "Which shows 345 written in expanded form?"
    options: ["3 + 4 + 5", "300 + 40 + 5", "30 + 40 + 5", "345 + 0"]
    correct_index: 1
    explanation: "Each digit is written as its place value: 300 + 40 + 5."
  - module: 2
    difficulty: easy
    sea_section: "Section I"
    prompt: "What is 200 + 50 + 3?"
    options: ["253", "2503", "2053", "235"]
    correct_index: 0
