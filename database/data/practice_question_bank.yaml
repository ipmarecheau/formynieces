  - module: 2
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which shows 7,930 in expanded form?"
    options: ["7000 + 90 + 3", "700 + 900 + 30", "7000 + 900 + 30", "7000 + 930 + 0"]
