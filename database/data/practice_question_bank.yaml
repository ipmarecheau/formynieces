  # ── Module 4 (MATH-004): Factors, Multiples, Primes and Squares ──
  - module: 4
    difficulty: easy
    sea_section: "Section I"
    prompt: "Which number is a factor of 10?"
    options: ["3", "5", "7", "4"]
    correct_index: 1
    explanation: "5 divides 10 exactly (10 ÷ 5 = 2), so 5 is a factor of 10."
  - module: 4
    difficulty: easy
    sea_section: "Section I"
    prompt: "What is 12 ÷ 4?"
    options: ["2", "3", "4", "6"]
    correct_index: 1
    explanation: "12 ÷ 4 = 3, so 4 is a factor of 12."
  - module: 4
    difficulty: easy
    sea_section: "Section I"
    prompt: "Which number is a multiple of 3?"
    options: ["8", "9", "10", "11"]
    correct_index: 1
    explanation: "9 = 3 x 3, so 9 is a multiple of 3."
  - module: 4
    difficulty: easy
    sea_section: "Section I"
    prompt: "What is the smallest factor of any whole number?"
    options: ["0", "1", "2", "the number itself"]
    correct_index: 1
    explanation: "1 divides every whole number, so it is always the smallest factor."
  - module: 4
    difficulty: easy
    sea_section: "Section I"
    prompt: "Which number is a factor of 8?"
    options: ["3", "5", "4", "6"]
    correct_index: 2
    explanation: "8 ÷ 4 = 2, so 4 is a factor of 8."
  - module: 4
    difficulty: medium
    sea_section: "Section I"
    prompt: "Which of these is a prime number?"
    options: ["9", "15", "11", "21"]
    correct_index: 2
    explanation: "11 has only two factors, 1 and 11, so it is prime."
  - module: 4
    difficulty: medium
    sea_section: "Section I"
    prompt: "What is the square of 3 (3 x 3)?"
    options: ["6", "9", "12", "33"]
    correct_index: 1
    explanation: "3 x 3 = 9."
  - module: 4
    difficulty: medium
    sea_section: "Section I"
    prompt: "Which number is a multiple of 5?"
    options: ["12", "18", "25", "33"]
    correct_index: 2
    explanation: "25 = 5 x 5, so it is a multiple of 5."
  - module: 4
    difficulty: medium
    sea_section: "Section I"
    prompt: "How many factors does a prime number have?"
    options: ["1", "2", "3", "many"]
    correct_index: 1
    explanation: "A prime has exactly two factors: 1 and itself."
  - module: 4
    difficulty: medium
    sea_section: "Section I"
    prompt: "Which number is NOT a factor of 20?"
    options: ["4", "5", "6", "10"]
    correct_index: 2
    explanation: "20 ÷ 6 does not divide exactly, so 6 is not a factor of 20."
  - module: 4
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which of these is a square number?"
    options: ["18", "24", "36", "40"]
    correct_index: 2
    explanation: "36 = 6 x 6, so it is a square number."
  - module: 4
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which of these is a prime number?"
    options: ["27", "29", "33", "39"]
    correct_index: 1
    explanation: "29 has only factors 1 and 29. (27, 33 and 39 are all multiples of 3.)"
  - module: 4
    difficulty: hard
    sea_section: "Section I"
    prompt: "What is the square of 7?"
    options: ["14", "42", "49", "77"]
    correct_index: 2
    explanation: "7 x 7 = 49."
  - module: 4
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which number is a common multiple of 2 and 3?"
    options: ["9", "10", "12", "14"]
    correct_index: 2
    explanation: "12 is a multiple of both 2 (2 x 6) and 3 (3 x 4)."
  - module: 4
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which number is a factor of both 12 and 18?"
    options: ["5", "6", "8", "7"]
    correct_index: 1
    explanation: "6 divides 12 (12 ÷ 6 = 2) and 18 (18 ÷ 6 = 3)."

  # ── Module 5 (MATH-005): Ordering and Comparing Whole Numbers ──
  - module: 5
    difficulty: easy
    sea_section: "Section I"
    prompt: "Which number is greater, 45 or 54?"
    options: ["45", "54", "they are equal", "neither"]
    correct_index: 1
    explanation: "54 has 5 tens against 4 tens, so 54 is greater."
  - module: 5
    difficulty: easy
    sea_section: "Section I"
    prompt: "Which symbol makes this true: 3 __ 8 ?"
    options: ["<", ">", "=", "+"]
    correct_index: 0
    explanation: "3 is less than 8, so we use < ."
  - module: 5
    difficulty: easy
    sea_section: "Section I"
    prompt: "Which is the smallest number: 12, 21 or 9?"
    options: ["12", "21", "9", "all equal"]
    correct_index: 2
    explanation: "9 is less than 12 and 21."
  - module: 5
    difficulty: easy
    sea_section: "Section I"
    prompt: "Which number is greater, 100 or 99?"
    options: ["100", "99", "equal", "neither"]
    correct_index: 0
    explanation: "100 is one more than 99."
  - module: 5
    difficulty: easy
    sea_section: "Section I"
    prompt: "Ordered from smallest, which number comes first: 5, 2 or 8?"
    options: ["5", "2", "8", "none"]
    correct_index: 1
    explanation: "2 is the smallest, so it comes first."
  - module: 5
    difficulty: medium
    sea_section: "Section I"
    prompt: "Which number is greater, 3,450 or 3,540?"
    options: ["3,450", "3,540", "equal", "neither"]
    correct_index: 1
    explanation: "They match in the thousands, but 3,540 has 5 hundreds against 4."
  - module: 5
    difficulty: medium
    sea_section: "Section I"
    prompt: "Which symbol makes this true: 250 __ 205 ?"
    options: ["<", ">", "=", "x"]
    correct_index: 1
    explanation: "250 has 5 tens against 0 tens, so 250 is greater: 250 > 205."
  - module: 5
    difficulty: medium
    sea_section: "Section I"
    prompt: "Which is the largest: 1,234; 1,243; or 1,324?"
    options: ["1,234", "1,243", "1,324", "equal"]
    correct_index: 2
    explanation: "1,324 has 3 hundreds, more than the others' 2 hundreds."
  - module: 5
    difficulty: medium
    sea_section: "Section I"
    prompt: "Which number is smaller, 6,300 or 6,030?"
    options: ["6,300", "6,030", "equal", "neither"]
    correct_index: 1
    explanation: "6,030 has 0 hundreds against 3 hundreds, so it is smaller."
  - module: 5
    difficulty: medium
    sea_section: "Section I"
    prompt: "Which is the largest: 999, 1000 or 990?"
    options: ["999", "1000", "990", "equal"]
    correct_index: 1
    explanation: "1000 is a four-digit number, larger than the three-digit ones."
  - module: 5
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which is the greatest: 45,600; 45,060; or 45,006?"
    options: ["45,600", "45,060", "45,006", "equal"]
    correct_index: 0
    explanation: "45,600 has 6 hundreds, more than the others."
  - module: 5
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which symbol makes this true: 10,101 __ 10,110 ?"
    options: ["<", ">", "=", "-"]
    correct_index: 0
    explanation: "They match until the tens: 10,101 has 0 tens against 1 ten, so 10,101 < 10,110."
  - module: 5
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which is the smallest: 78,900; 78,090; or 78,009?"
    options: ["78,900", "78,090", "78,009", "equal"]
    correct_index: 2
    explanation: "78,009 has 0 hundreds and 0 tens, so it is the smallest."
  - module: 5
    difficulty: hard
    sea_section: "Section I"
    prompt: "Ordered largest first, which is second: 3,200; 3,020; 3,002?"
    options: ["3,200", "3,020", "3,002", "none"]
    correct_index: 1
    explanation: "The order is 3,200 then 3,020 then 3,002, so 3,020 is second."
  - module: 5
    difficulty: hard
    sea_section: "Section I"
    prompt: "Which number is greater, 100,000 or 99,999?"
    options: ["100,000", "99,999", "equal", "neither"]
