        context_sentence: "The grateful owner offered him a reward."
      - word: "reward"
        definition: "something given in return for good work"
        context_sentence: "Doing the right thing was reward enough."

  - title: "Looking at the Stars"
    reading_level: 5
    body: >
      For thousands of years, people have gazed up at the night sky and wondered.
      The ancient sailors used the stars to find their way across vast oceans,
      long before maps or machines. Astronomers study the stars to learn how the
      universe works. Some stars we see tonight are so far away that their light
      began its journey before we were born. When you look up, you are gazing not
      just across great distances, but back through time itself.
    questions:
      - prompt: "How did ancient sailors use the stars?"
        type: mc
        options: ["to find their way across oceans", "to tell the temperature", "to catch fish", "to send messages"]
        correct_index: 0
      - prompt: "Why can starlight be older than the person looking at it?"
        type: mc
        options: ["the light travelled a long time to reach us", "stars are ancient people", "the sky is old", "light moves backwards"]
        correct_index: 0
      - prompt: "Explain the idea that looking at stars is 'gazing back through time itself'."
        type: written
    vocabulary:
      - word: "gazed"
        definition: "looked steadily for a long time"
        context_sentence: "People have gazed up at the night sky."
      - word: "vast"
        definition: "extremely large"
        context_sentence: "Sailors crossed vast oceans."
      - word: "astronomers"
        definition: "scientists who study the stars and planets"
        context_sentence: "Astronomers study the stars."

  - title: "Stage Fright"
    reading_level: 5
    body: >
      Reya had practised her poem until she knew every word. Yet as she stepped
      onto the stage, her heart pounded and her hands trembled. The bright lights
      and the sea of faces made her mind go blank. She took a slow, deep breath
      and remembered her teacher's advice: speak to one friendly face at a time.
      Slowly her voice steadied. By the last line, she had forgotten her fear
      entirely. The applause taught her that courage is not the absence of fear,
      but acting in spite of it.
    questions:
      - prompt: "What happened to Reya when she stepped onto the stage?"
        type: mc
        options: ["her heart pounded and her mind went blank", "she forgot the poem", "she fell", "she laughed"]
        correct_index: 0
      - prompt: "What advice helped her steady her voice?"
        type: mc
        options: ["speak to one friendly face at a time", "close her eyes", "speak very fast", "look at the floor"]
        correct_index: 0
      - prompt: "Explain the lesson that 'courage is not the absence of fear'."
        type: written
    vocabulary:
      - word: "trembled"
        definition: "shook slightly, often from fear"
        context_sentence: "Her hands trembled."
      - word: "steadied"
        definition: "became firm and calm"
        context_sentence: "Slowly her voice steadied."
      - word: "courage"
        definition: "the ability to face fear or danger"
        context_sentence: "Courage is acting in spite of fear."

  - title: "The Marathon"
    reading_level: 5
    body: >
      Sunil trained for months before the big marathon. The route stretched over
      twenty-six miles through the hot city streets. From the start, faster
      runners surged ahead, and Sunil felt like giving up. But he set himself a
      simple goal: reach the next corner, then the next. Mile after mile fell
      behind him. His legs burned and his lungs ached, yet he pressed on. When at
      last he crossed the finish line, he understood that the race had been won
      not with his legs, but with his mind.
    questions:
      - prompt: "How long was the marathon route?"
        type: mc
        options: ["over twenty-six miles", "ten miles", "five miles", "one hundred miles"]
        correct_index: 0
      - prompt: "What simple goal did Sunil set himself?"
        type: mc
        options: ["reach the next corner, then the next", "beat everyone", "run very fast", "stop and rest"]
        correct_index: 0
      - prompt: "Explain what Sunil means by 'the race had been won with his mind'."
        type: written
    vocabulary:
      - word: "surged"
        definition: "moved forward suddenly and powerfully"
        context_sentence: "Faster runners surged ahead."
      - word: "pressed"
        definition: "kept going with effort"
        context_sentence: "He pressed on."
      - word: "understood"
        definition: "came to know the meaning of something"
        context_sentence: "He understood the race had been won with his mind."

  - title: "The Power of Reading"
    reading_level: 5
    body: >
      Books are like doors that open onto other worlds. Through reading, a child
      in a small village can wander the streets of distant cities, dive to the
      ocean floor, or travel back to ancient times. Reading builds not only
      knowledge but imagination and empathy, letting us feel what others feel.
      The more we read, the wider our world becomes and the better we understand
      it. A person who reads lives a thousand lives; a person who never reads
      lives only one.
    questions:
      - prompt: "What does the passage compare books to?"
        type: mc
        options: ["doors onto other worlds", "heavy stones", "empty boxes", "closed windows"]
        correct_index: 0
      - prompt: "Besides knowledge, what does reading build?"
        type: mc
        options: ["imagination and empathy", "muscles", "money", "speed"]
        correct_index: 0
      - prompt: "Explain the meaning of 'a person who reads lives a thousand lives'."
        type: written
    vocabulary:
      - word: "wander"
        definition: "to move about without a fixed path"
        context_sentence: "A child can wander the streets of distant cities."
      - word: "imagination"
        definition: "the power to form pictures in the mind"
        context_sentence: "Reading builds imagination."
      - word: "empathy"
        definition: "the ability to understand another's feelings"
        context_sentence: "Reading builds empathy."

  - title: "The Kind Bus Driver"
    reading_level: 5
    body: >
      Mr Baptiste had driven the same route for thirty years. He knew every
      passenger by name and always had a warm greeting. When an elderly woman
      could not find her fare one morning, he quietly paid it himself and waved
      her aboard. On rainy days he waited an extra moment for the child running
      late. His small kindnesses cost him little but meant a great deal to others.
      When he retired, the whole community came to thank the man who had made
      every journey brighter.
    questions:
      - prompt: "How long had Mr Baptiste driven the route?"
        type: mc
        options: ["thirty years", "one year", "ten years", "fifty years"]
        correct_index: 0
      - prompt: "What did he do when the elderly woman could not find her fare?"
        type: mc
        options: ["he quietly paid it himself", "he made her leave", "he waited an hour", "he called for help"]
        correct_index: 0
      - prompt: "Explain why the community came to thank him when he retired."
        type: written
    vocabulary:
      - word: "greeting"
        definition: "friendly words said when you meet someone"
        context_sentence: "He always had a warm greeting."
      - word: "fare"
        definition: "the money paid to travel"
        context_sentence: "She could not find her fare."
      - word: "retired"
        definition: "stopped working after many years"
        context_sentence: "When he retired, the community thanked him."

  - title: "How Birds Fly"
    reading_level: 5
    body: >
      Have you ever watched a corbeau circle high above without flapping its
      wings? Birds are built for flight in wonderful ways. Their bones are light
      and hollow, so they are not too heavy to rise. Their curved wings push air
      downward, and the air pushes them up in return. By spreading their feathers,
      they ride on rising warm air like a surfer on a wave. Everything about a
      bird, from its shape to its feathers, works together to conquer the sky.
    questions:
      - prompt: "Why are birds not too heavy to fly?"
        type: mc
        options: ["their bones are light and hollow", "they eat little", "they are small", "they have feathers"]
        correct_index: 0
      - prompt: "How does a bird rise without flapping?"
        type: mc
        options: ["it rides on rising warm air", "it holds its breath", "it swims", "it uses its tail only"]
        correct_index: 0
      - prompt: "Explain how a bird's curved wings help it rise."
        type: written
    vocabulary:
      - word: "hollow"
        definition: "having an empty space inside"
        context_sentence: "Their bones are light and hollow."
      - word: "curved"
        definition: "bent in a smooth line, not straight"
        context_sentence: "Their curved wings push air downward."
      - word: "conquer"
        definition: "to overcome or master something"
        context_sentence: "Everything works together to conquer the sky."

  - title: "A Letter to the Future"
    reading_level: 5
    body: >
      Our class buried a time capsule in the schoolyard, to be opened in fifty
      years. Inside we placed photographs, a newspaper, and letters to the
      students of the future. I wrote about my hopes for a cleaner, kinder world.
      It felt strange to imagine a child not yet born reading my words. Perhaps by
      then the problems we face will be solved, or perhaps new ones will have
      arisen. Either way, I hope our letters remind them that people long ago
      cared deeply about their tomorrow.
    questions:
      - prompt: "When is the time capsule to be opened?"
        type: mc
        options: ["in fifty years", "next year", "in ten years", "never"]
        correct_index: 0
      - prompt: "What did the writer's letter describe?"
        type: mc
        options: ["hopes for a cleaner, kinder world", "a favourite game", "the weather", "a shopping list"]
        correct_index: 0
      - prompt: "Explain why it felt 'strange' to write to a child not yet born."
        type: written
    vocabulary:
      - word: "capsule"
        definition: "a sealed container"
        context_sentence: "We buried a time capsule."
      - word: "imagine"
        definition: "to form a picture of something in the mind"
        context_sentence: "It felt strange to imagine a future child."
      - word: "arisen"
        definition: "come into being; appeared"
        context_sentence: "New problems will have arisen."

  - title: "The Coral in Danger"
    reading_level: 5
    body: >
      Scientists have grown worried about the coral reefs of the Caribbean. When
      the sea becomes too warm, the coral loses its colour and turns a ghostly
      white, a process called bleaching. Bleached coral is weak and can easily
      die, taking with it the countless creatures that depend on the reef. Warmer
      seas are caused partly by the way people burn fuels and heat the planet. Yet
      there is hope: by protecting the reefs and reducing pollution, communities
      can give the coral a chance to recover.
    questions:
      - prompt: "What happens to coral when the sea becomes too warm?"
        type: mc
        options: ["it loses colour and turns white (bleaching)", "it grows faster", "it turns green", "it becomes stone"]
        correct_index: 0
      - prompt: "According to the passage, what gives the coral 'a chance to recover'?"
        type: mc
        options: ["protecting reefs and reducing pollution", "warmer water", "more fishing", "doing nothing"]
        correct_index: 0
      - prompt: "Explain why bleached coral puts other sea creatures in danger."
        type: written
    vocabulary:
      - word: "bleaching"
        definition: "losing colour and turning white"
        context_sentence: "This process is called bleaching."
      - word: "depend"
        definition: "to need something to survive"
        context_sentence: "Creatures that depend on the reef."
      - word: "recover"
        definition: "to become healthy again"
        context_sentence: "The coral gets a chance to recover."

  - title: "The Village Storyteller"
    reading_level: 5
    body: >
      Every full moon, the children of the village gathered under the samaan tree
      to hear old Tante Cee tell her tales. Her voice rose and fell like music as
      she spun stories of clever spiders, brave heroes, and talking animals. Some
      tales made them laugh, others sent shivers down their spines, but each one
      carried a lesson wrapped inside. Long before books were common, it was
      through such storytellers that the wisdom of the ancestors passed from one
      generation to the next.
    questions:
      - prompt: "When did the children gather to hear the stories?"
        type: mc
        options: ["every full moon", "every morning", "on Sundays", "at Christmas"]
        correct_index: 0
      - prompt: "What did each of Tante Cee's tales carry inside it?"
        type: mc
        options: ["a lesson", "a song", "a gift", "a secret name"]
        correct_index: 0
      - prompt: "Explain how storytellers helped pass on 'the wisdom of the ancestors'."
        type: written
    vocabulary:
      - word: "gathered"
        definition: "came together in a group"
        context_sentence: "The children gathered under the samaan tree."
      - word: "spun"
        definition: "told or created (a story)"
        context_sentence: "She spun stories of clever spiders."
      - word: "generation"
        definition: "all the people born around the same time"
        context_sentence: "Wisdom passed from one generation to the next."

  - title: "The Determined Farmer"
    reading_level: 5
    body: >
      When drought struck the district, most farmers gave up and let their fields
      turn to dust. But Mr Ali refused to surrender. He dug a small pond to catch
      what little rain fell and carried water in buckets to his youngest plants.
      Neighbours called him foolish for working so hard on dying land. Yet when
      the rains at last returned, his roots were still alive while others had to
      start again. His harvest that season was the finest for miles. Persistence,
      the district learned, often outlasts hardship.
    questions:
      - prompt: "What did Mr Ali do to save his youngest plants?"
        type: mc
        options: ["carried water in buckets to them", "moved them indoors", "cut them down", "left them alone"]
        correct_index: 0
      - prompt: "Why was his harvest the finest for miles that season?"
        type: mc
        options: ["his roots stayed alive through the drought", "he planted more", "he had better seeds", "it rained only on his field"]
        correct_index: 0
      - prompt: "Explain the lesson that 'persistence often outlasts hardship'."
        type: written
    vocabulary:
      - word: "drought"
        definition: "a long period with little or no rain"
        context_sentence: "When drought struck the district."
      - word: "surrender"
        definition: "to give up"
        context_sentence: "Mr Ali refused to surrender."
      - word: "persistence"
        definition: "the quality of not giving up"
        context_sentence: "Persistence often outlasts hardship."

  - title: "The Hummingbird's Secret"
    reading_level: 5
    body: >
      The hummingbird is a tiny marvel of nature. Its wings beat so fast that they
      become a blur and produce a soft humming sound. This rapid motion lets the
      bird hover perfectly still in the air, sipping nectar from deep inside
      flowers with its long, slender beak. To fuel such effort, it must eat almost
      constantly, visiting hundreds of blooms a day. In return, it carries pollen
      from flower to flower, helping the plants to reproduce. Small though it is,
      the hummingbird plays a mighty role in its habitat.
    questions:
      - prompt: "Why can the hummingbird hover perfectly still?"
        type: mc
        options: ["its wings beat extremely fast", "it holds its breath", "it grips a branch", "it is very light"]
        correct_index: 0
      - prompt: "Why must the hummingbird eat almost constantly?"
        type: mc
        options: ["to fuel the effort of its fast wings", "it is greedy", "flowers are far apart", "it stores food"]
        correct_index: 0
      - prompt: "Explain how the hummingbird helps plants while feeding."
        type: written
    vocabulary:
      - word: "marvel"
        definition: "something that causes wonder"
        context_sentence: "The hummingbird is a tiny marvel of nature."
      - word: "hover"
        definition: "to stay in one place in the air"
        context_sentence: "It can hover perfectly still."
      - word: "reproduce"
        definition: "to produce young or new plants"
        context_sentence: "It helps the plants to reproduce."

  - title: "The Great Debate"
    reading_level: 5
    body: >
      The school held a debate on whether pupils should be allowed to bring phones
      to class. One side argued that phones help with research and keep families
      in touch. The other warned that phones distract from learning and tempt
      cheating. Both teams gathered evidence and spoke with passion. In the end,
      the judges did not simply pick a winner, but praised how each side listened
      and answered the other with respect. A good debate, the principal said,
      sharpens the mind and teaches us to disagree without quarrelling.
    questions:
      - prompt: "What was the debate about?"
        type: mc
        options: ["whether pupils should bring phones to class", "the school uniform", "sports day", "lunch menus"]
        correct_index: 0
      - prompt: "What did the judges praise most?"
        type: mc
        options: ["how each side listened with respect", "how loud they were", "how long they spoke", "who had more people"]
        correct_index: 0
      - prompt: "Explain what is meant by learning 'to disagree without quarrelling'."
        type: written
    vocabulary:
      - word: "argued"
        definition: "gave reasons for or against something"
        context_sentence: "One side argued that phones help with research."
      - word: "distract"
        definition: "to take attention away"
        context_sentence: "Phones distract from learning."
      - word: "evidence"
        definition: "facts that show something is true"
        context_sentence: "Both teams gathered evidence."

  - title: "The Eclipse"
    reading_level: 5
    body: >
      One afternoon the sky began to darken, though it was not yet evening. A
      solar eclipse was taking place, as the moon moved directly between the earth
      and the sun. For a few minutes, the moon blocked the sun's light, and a
      strange twilight fell over the land. Birds grew quiet, thinking night had
      come. Our teacher warned us never to look straight at the sun, but to view
      it safely through a special filter. Then, as the moon slid onward, daylight
      returned, and the world woke up again.
    questions:
      - prompt: "What causes a solar eclipse?"
        type: mc
        options: ["the moon moves between the earth and the sun", "the sun goes out", "clouds cover the sun", "the earth stops"]
        correct_index: 0
      - prompt: "Why did the birds grow quiet?"
        type: mc
        options: ["they thought night had come", "they were frightened of noise", "they flew away", "they were hungry"]
        correct_index: 0
      - prompt: "Explain why the teacher warned against looking straight at the sun."
        type: written
    vocabulary:
      - word: "eclipse"
        definition: "when one body in space blocks the light of another"
        context_sentence: "A solar eclipse was taking place."
      - word: "twilight"
        definition: "the dim light between day and night"
        context_sentence: "A strange twilight fell over the land."
      - word: "filter"
        definition: "something that lets only part of the light through"
        context_sentence: "View it safely through a special filter."

  - title: "The Wisdom of the Elder"
    reading_level: 5
    body: >
      When two brothers quarrelled bitterly over a piece of land, they went to old
      Pa Joseph for judgement. He listened to each in turn without a word. Then he
      handed them a single dry stick and asked each to break it, which they did
      with ease. Next he tied ten sticks together and asked them to break the
      bundle. Try as they might, neither could. 'Alone you are easily broken,' he
      said, 'but together you cannot be.' The brothers understood, and shared the
      land in peace.
    questions:
      - prompt: "What could the brothers not break?"
        type: mc
        options: ["a bundle of ten sticks tied together", "a single stick", "a rope", "a stone"]
        correct_index: 0
      - prompt: "What did Pa Joseph want the brothers to learn?"
        type: mc
        options: ["they are stronger together than apart", "sticks are strong", "he was clever", "land is worthless"]
        correct_index: 0
      - prompt: "Explain the meaning of 'Alone you are easily broken, but together you cannot be'."
        type: written
    vocabulary:
      - word: "quarrelled"
        definition: "argued angrily"
        context_sentence: "Two brothers quarrelled over land."
      - word: "judgement"
        definition: "a decision about what is right"
        context_sentence: "They went to Pa Joseph for judgement."
      - word: "bundle"
        definition: "a number of things tied together"
        context_sentence: "He tied ten sticks into a bundle."

  - title: "The Sound of Music"
    reading_level: 5
    body: >
      Sound is a kind of invisible wave that travels through the air. When a pan
      is struck or a string is plucked, it vibrates rapidly back and forth. These
      vibrations push the air into waves that spread outward until they reach our
      ears. The faster something vibrates, the higher the note we hear; the slower
      it vibrates, the lower the note. Our ears turn these tiny waves into the
      music we love. What seems like magic is really the wonderful science of
      moving air.
    questions:
      - prompt: "What happens to an object when it makes a sound?"
        type: mc
        options: ["it vibrates rapidly", "it grows hot", "it changes colour", "it stops moving"]
        correct_index: 0
      - prompt: "What decides whether a note is high or low?"
        type: mc
        options: ["how fast the object vibrates", "how big it is", "its colour", "how heavy it is"]
        correct_index: 0
      - prompt: "Explain how a sound reaches our ears from a plucked string."
        type: written
    vocabulary:
      - word: "invisible"
        definition: "not able to be seen"
        context_sentence: "Sound is an invisible wave."
      - word: "vibrates"
        definition: "moves quickly back and forth"
        context_sentence: "The string vibrates rapidly."
      - word: "spread"
        definition: "to move outward over an area"
        context_sentence: "The waves spread outward."

  - title: "The Champion's Discipline"
    reading_level: 5
    body: >
      People saw only the medals that Keisha won and called her lucky. They did
      not see the cold mornings when she rose at five to train while others slept.
      They did not see the sweets she gave up or the parties she missed. Talent,
      her coach often reminded her, is only a beginning; it is discipline that
      turns talent into greatness. Every champion, Keisha knew, is built not in
      the bright moment of victory, but in the quiet hours of hard, unseen work.
    questions:
      - prompt: "What did people fail to see about Keisha's success?"
        type: mc
        options: ["the hard, unseen training", "her medals", "her races", "her coach"]
        correct_index: 0
      - prompt: "According to her coach, what turns talent into greatness?"
        type: mc
        options: ["discipline", "luck", "money", "friends"]
        correct_index: 0
      - prompt: "Explain the idea that a champion is 'built in the quiet hours of hard work'."
        type: written
    vocabulary:
      - word: "talent"
        definition: "a natural ability to do something well"
        context_sentence: "Talent is only a beginning."
      - word: "discipline"
        definition: "the practice of training oneself to work hard"
        context_sentence: "It is discipline that turns talent into greatness."
      - word: "victory"
        definition: "a win or success"
        context_sentence: "Not in the bright moment of victory."

  - title: "The Value of Failure"
    reading_level: 5
    body: >
      When Thomas first tried to build a working model bridge, it collapsed at
      once. His second attempt sagged in the middle, and his third snapped under a
      light weight. Rather than give up, Thomas studied each failure to learn why
      it had happened. Slowly he understood how to spread the load and strengthen
      the joints. His final bridge held far more weight than any other in the
      class. Failure, he realised, is not the opposite of success but a step on
      the road toward it.
    questions:
      - prompt: "What did Thomas do after each bridge failed?"
        type: mc
        options: ["studied the failure to learn why", "gave up", "copied a friend", "started a new hobby"]
        correct_index: 0
      - prompt: "How did his final bridge compare to the others?"
        type: mc
        options: ["it held far more weight", "it was the smallest", "it also collapsed", "it was the prettiest"]
        correct_index: 0
      - prompt: "Explain the idea that 'failure is a step on the road toward success'."
        type: written
    vocabulary:
      - word: "collapsed"
        definition: "fell down suddenly"
        context_sentence: "The model bridge collapsed at once."
      - word: "sagged"
        definition: "sank or bent downward in the middle"
        context_sentence: "His second attempt sagged in the middle."
      - word: "load"
        definition: "the weight that something carries"
        context_sentence: "He understood how to spread the load."

  - title: "Life in a Pond"
    reading_level: 5
    body: >
      A quiet pond may seem like still water, but it teems with life. On the
      surface, insects skate and lily pads float. Below, small fish dart among the
      weeds while tadpoles wriggle toward becoming frogs. Tiny plants make food
      from sunlight and give off the oxygen the creatures breathe. Each living
      thing depends on the others: the frog eats the insect, the bird eats the
      frog. Together they form a delicate balance, an entire tiny world contained
      within a single pond.
    questions:
      - prompt: "What are tadpoles in the process of becoming?"
        type: mc
        options: ["frogs", "fish", "birds", "insects"]
        correct_index: 0
      - prompt: "What do the tiny plants provide for the creatures?"
        type: mc
        options: ["food and oxygen", "shade only", "shelter only", "water"]
        correct_index: 0
      - prompt: "Explain what is meant by the 'delicate balance' of the pond."
        type: written
    vocabulary:
      - word: "teems"
        definition: "is full of; swarms with"
        context_sentence: "The pond teems with life."
      - word: "oxygen"
        definition: "the gas that living things need to breathe"
        context_sentence: "Plants give off the oxygen creatures breathe."
      - word: "balance"
        definition: "a state where things are in the right amounts"
        context_sentence: "They form a delicate balance."

  - title: "The First Carnival"
    reading_level: 5
    body: >
      Carnival in Trinidad and Tobago has deep and serious roots. Long ago, when
      the enslaved people won their freedom, they took to the streets to
      celebrate. They created their own music, costumes, and dances, turning
      pain into joy and struggle into art. Over time these celebrations grew into
      the great festival we know today, with its steelpan, calypso, and dazzling
      masquerade. Behind every feather and every beat lies a story of a people who
      transformed their suffering into one of the greatest cultural festivals on
      earth.
    questions:
      - prompt: "When did the enslaved people first take to the streets to celebrate?"
        type: mc
        options: ["when they won their freedom", "at Christmas", "at harvest time", "when the ships arrived"]
        correct_index: 0
      - prompt: "What did the people turn their struggle into?"
        type: mc
        options: ["art", "money", "silence", "war"]
        correct_index: 0
      - prompt: "Explain what is meant by 'turning pain into joy and struggle into art'."
        type: written
    vocabulary:
      - word: "enslaved"
        definition: "made to be a slave, forced to work without freedom"
        context_sentence: "The enslaved people won their freedom."
      - word: "masquerade"
