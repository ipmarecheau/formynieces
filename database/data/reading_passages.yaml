  - title: "The Village Potter"
    reading_level: 4
    body: >
      In the village lives a potter named Miss Rookmin. She digs clay from the
      river bank and shapes it with her hands. On her spinning wheel, a lump of
      clay rises into a smooth bowl. She dries her pots in the sun, then bakes
      them in a hot oven. People come from far to buy her jars and cups. What was
      once soft mud becomes something useful and beautiful.
