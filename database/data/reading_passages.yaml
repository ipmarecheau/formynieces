  - title: "The Rainforest Walk"
    reading_level: 4
    body: >
      Our guide led us along a narrow path deep into the rainforest. Tall trees
      formed a green roof high above us. The air was damp and full of the calls
      of unseen birds. We spotted a bright hummingbird and a line of leaf-cutter
      ants. The guide warned us to look but never to take. A rainforest, he said,
      is a delicate web where every plant and creature has its place.
