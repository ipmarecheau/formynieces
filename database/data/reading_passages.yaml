  - title: "The Wise Parrot"
    reading_level: 4
    body: >
      A green parrot lived in the yard and could copy any sound it heard. It
      whistled like the kettle and barked like the dog. One day a thief crept into
      the yard at night. The parrot suddenly shouted, "Who is there?" in the
      grandmother's voice. The frightened thief ran away, thinking someone was
      awake. In the morning, the family laughed and gave the clever parrot an
      extra piece of fruit.
