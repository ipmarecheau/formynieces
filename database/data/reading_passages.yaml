        correct_index: 0
      - prompt: "Why is the swamp called a 'nursery'?"
        type: mc
        options: ["young sea creatures shelter and grow there", "babies are born there", "flowers grow there", "it is quiet"]
        correct_index: 0
      - prompt: "Explain why the mangrove is important even though it 'may look like wasteland'."
        type: written
    vocabulary:
