        definition: "created something that did not exist before"
        context_sentence: "The steelpan is the only instrument invented in the twentieth century."
      - word: "discarded"
        definition: "thrown away as no longer wanted"
        context_sentence: "They experimented with discarded oil drums."
      - word: "celebrated"
        definition: "praised and admired widely"
        context_sentence: "The pan is now celebrated worldwide."

  - title: "The Mangrove Swamp"
    reading_level: 5
    body: >
      Where the river meets the sea, mangrove trees grow in the salty mud. Their
      tangled roots arch above the water like bent fingers. These roots trap mud
      and protect the coast from crashing waves and storms. The swamp is a nursery
      for young fish, crabs, and shrimp, which shelter among the roots until they
      are big enough for the open sea. Birds nest in the branches above. Though it
      may look like wasteland, the mangrove is one of the richest and most
      important habitats on earth.
