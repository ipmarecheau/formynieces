  - title: "The Flood"
    reading_level: 4
    body: >
      After days of heavy rain, the river burst its banks. Brown water crept into
      the streets and then into the houses. Families rushed to move their
      belongings upstairs. Neighbours helped one another carry the old and the
      young to safety. Boats moved slowly along roads that had become rivers.
