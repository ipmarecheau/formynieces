        definition: "by chance, not on purpose"
        context_sentence: "He had accidentally seen the answer sheet."
      - word: "honesty"
        definition: "the quality of telling the truth"
        context_sentence: "Honesty when no one is watching."
      - word: "character"
        definition: "the sort of person someone truly is"
        context_sentence: "The truest test of character."

  - title: "The Blackout Rescue"
    reading_level: 5
    body: >
      When the great storm knocked out the power, the whole town fell dark. In one
      house, an elderly man who needed his breathing machine was in danger. His
      young neighbour, Shanti, remembered that the health centre had a generator.
      Without hesitating, she ran through the driving rain to fetch help. Nurses
      hurried back with her and moved the old man to safety. Later, people called
      Shanti a hero, but she said she had only done what any good neighbour should.
      Sometimes courage is simply refusing to look away.
    questions:
      - prompt: "Why was the elderly man in danger during the blackout?"
        type: mc
        options: ["he needed his breathing machine", "his house flooded", "he was lost", "he had no food"]
        correct_index: 0
      - prompt: "What did Shanti remember that could help?"
        type: mc
        options: ["the health centre had a generator", "the shop sold candles", "the road was open", "the phone worked"]
        correct_index: 0
      - prompt: "Explain what Shanti meant by 'courage is simply refusing to look away'."
        type: written
    vocabulary:
      - word: "generator"
        definition: "a machine that makes electricity"
        context_sentence: "The health centre had a generator."
      - word: "hesitating"
        definition: "pausing before acting because of doubt"
        context_sentence: "Without hesitating, she ran for help."
      - word: "hero"
        definition: "a person admired for brave deeds"
        context_sentence: "People called Shanti a hero."

  - title: "The Gift of Music"
    reading_level: 5
    body: >
      In the children's ward of the hospital, the days could feel long and grey.
      Then, on Wednesdays, a group of volunteers came to play music for the sick
      children. As the guitar and pan began to sing, faces that had been dull
      lifted into smiles. Some children clapped, others simply closed their eyes
      and listened. The doctors noticed that the young patients seemed calmer and
      even healed a little faster. Music, it seems, can reach places that medicine
      alone cannot.
    questions:
      - prompt: "Who came to the ward on Wednesdays?"
        type: mc
        options: ["a group of volunteers to play music", "new doctors", "the children's families", "teachers"]
        correct_index: 0
      - prompt: "What did the doctors notice about the young patients?"
        type: mc
        options: ["they seemed calmer and healed faster", "they slept less", "they ate more", "they grew taller"]
        correct_index: 0
      - prompt: "Explain the idea that 'music can reach places that medicine alone cannot'."
        type: written
    vocabulary:
      - word: "ward"
        definition: "a room in a hospital for patients"
        context_sentence: "In the children's ward of the hospital."
      - word: "volunteers"
        definition: "people who help without being paid"
        context_sentence: "A group of volunteers came to play music."
      - word: "healed"
        definition: "became well again"
        context_sentence: "The children healed a little faster."

  - title: "The Young Entrepreneur"
    reading_level: 5
    body: >
      Twelve-year-old Aaliyah wanted to earn money for a new bicycle. Rather than
      simply asking her parents, she looked around for a need she could fill. She
      noticed that neighbours often had ripe fruit going to waste. So she began
      collecting it, making fresh juice, and selling it at the corner on hot
      afternoons. She kept careful records of what she spent and earned. Within a
      few months, she had saved enough for her bicycle and learned lessons about
      money that no classroom could teach.
    questions:
      - prompt: "What need did Aaliyah notice she could fill?"
        type: mc
        options: ["ripe fruit was going to waste", "the road was dirty", "children were hungry", "the shop was closed"]
        correct_index: 0
      - prompt: "What did she keep careful records of?"
        type: mc
        options: ["what she spent and earned", "the weather", "her homework", "her friends"]
        correct_index: 0
      - prompt: "Explain what lessons Aaliyah learned that 'no classroom could teach'."
        type: written
    vocabulary:
