  # ── Level 5 ──
  - title: "The Birth of the Steelpan"
    reading_level: 5
    body: >
      The steelpan is the only acoustic musical instrument invented in the
      twentieth century, and it was born in Trinidad and Tobago. In the crowded
      yards of Laventille, young men experimented with discarded oil drums. By
      carefully hammering dents into the metal, they discovered that different
      areas produced different notes. What began as noise on rubbish became rich,
      ringing melodies. Once frowned upon, the pan is now celebrated worldwide as
      the national instrument. It stands as proof that creativity can rise from
      the humblest of beginnings.
    questions:
      - prompt: "What everyday objects were used to make the first steelpans?"
        type: mc
        options: ["discarded oil drums", "wooden boxes", "metal pipes", "clay pots"]
        correct_index: 0
      - prompt: "How did the makers get different notes from the metal?"
        type: mc
        options: ["by hammering dents into different areas", "by painting it", "by heating it", "by cutting holes"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'creativity can rise from the humblest of beginnings'."
        type: written
    vocabulary:
