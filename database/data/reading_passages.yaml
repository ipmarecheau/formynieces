        definition: "the cases that hold seeds"
        context_sentence: "Their pods held the cocoa beans."
      - word: "reviving"
        definition: "bringing back to life or use"
        context_sentence: "Some farmers are reviving the old estates."
      - word: "flavour"
        definition: "the taste of something"
        context_sentence: "They share the rich flavour of Trinitario cocoa."

  - title: "The Difficult Decision"
    reading_level: 5
    body: >
      Kofi found a wallet stuffed with money on the pavement. His family was poor,
      and the cash could buy so much they needed. For a moment he was tempted to
      keep it. But he thought of how worried the owner must be. Inside the wallet
      was a card with an address. Kofi walked a mile to return it. The grateful
      owner offered him a reward, but Kofi simply smiled and said doing the right
      thing was reward enough. He walked home poorer in pocket but richer in
      spirit.
    questions:
      - prompt: "What did Kofi find on the pavement?"
        type: mc
        options: ["a wallet full of money", "a bag of food", "a phone", "a watch"]
        correct_index: 0
      - prompt: "How did Kofi find the owner?"
        type: mc
