  - title: "The Story of Cocoa"
    reading_level: 5
    body: >
      Long ago, Trinidad was famous around the world for its fine cocoa. Farmers
      grew the trees in the shade of the hills, and their pods held the seeds we
      call cocoa beans. Workers split the pods, scooped out the wet beans, and
      left them to dry in the sun, dancing on them to keep them turning. From
      these humble beans came the chocolate loved everywhere. Today, some farmers
      are reviving the old estates, proud to share the rich flavour of Trinitario
      cocoa once more.
    questions:
      - prompt: "Where did the seeds we call cocoa beans come from?"
        type: mc
        options: ["inside the pods of the cocoa tree", "from the roots", "from the flowers", "from the leaves"]
        correct_index: 0
      - prompt: "Why did the workers dance on the beans?"
        type: mc
        options: ["to keep them turning as they dried", "to celebrate", "to clean their feet", "to make music"]
        correct_index: 0
      - prompt: "Explain why some farmers today are 'reviving the old estates'."
        type: written
    vocabulary:
