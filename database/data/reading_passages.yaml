        context_sentence: "A people who transformed their suffering."

  - title: "The Courage to Be Honest"
    reading_level: 5
    body: >
      During the test, Denzil realised he had accidentally seen a classmate's
      answer sheet. When he received full marks, he knew that one of them was not
      truly his own. It would have been easy to say nothing. Instead, he went to
      his teacher and explained what had happened. The teacher was surprised, then
      deeply proud. She told him that honesty when no one is watching is the truest
      test of character. Denzil lost one mark that day, but he kept something far
      more valuable.
    questions:
      - prompt: "Why did Denzil feel one mark was not truly his own?"
        type: mc
        options: ["he had accidentally seen a classmate's answer", "he had guessed it", "the teacher told him", "he cheated on purpose"]
        correct_index: 0
      - prompt: "What did the teacher say is the truest test of character?"
        type: mc
        options: ["honesty when no one is watching", "getting full marks", "working quickly", "helping friends"]
        correct_index: 0
      - prompt: "Explain what 'far more valuable' thing Denzil kept."
        type: written
