      - prompt: "How many bins did the club place?"
        type: mc
        options: ["three", "two", "four", "one"]
        correct_index: 0
      - prompt: "What did the club do with the money from the plastic?"
        type: mc
        options: ["bought new books", "kept it", "threw it away", "gave a party"]
        correct_index: 0
      - prompt: "Write how the club got more students to join in."
        type: written
