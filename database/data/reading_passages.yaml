  - title: "The Young Inventor"
    reading_level: 5
    body: >
      Amara noticed that her grandmother struggled to see the small buttons on the
      stove. Instead of accepting the problem, she decided to solve it. Using
      cardboard and bright stickers, she built a simple guide that fitted over the
      dials. Her grandmother could now cook safely on her own. Amara's teacher
      entered the idea in a national competition, where it won first prize. The
      judges praised not the fancy materials, but the caring thought behind the
      invention. A good idea, they said, begins with noticing a real need.
