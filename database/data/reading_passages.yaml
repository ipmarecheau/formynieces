  - title: "Shadows"
    reading_level: 4
    body: >
      Have you ever noticed how your shadow changes during the day? In the early
      morning, when the sun is low, your shadow is long and thin. At noon, when
      the sun is high overhead, your shadow shrinks to a small dark pool at your
      feet. As evening comes, it stretches out long again. A shadow forms because
      your body blocks the light. Watching shadows can even tell you the time of
      day.
    questions:
      - prompt: "When is your shadow long and thin?"
        type: mc
        options: ["in the early morning", "at noon", "at midnight", "never"]
        correct_index: 0
      - prompt: "Why does a shadow form?"
        type: mc
        options: ["your body blocks the light", "the sun is cold", "the ground is dark", "the wind blows"]
        correct_index: 0
