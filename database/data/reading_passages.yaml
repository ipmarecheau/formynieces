  - title: "Shadows"
    reading_level: 4
    body: >
      Have you ever noticed how your shadow changes during the day? In the early
      morning, when the sun is low, your shadow is long and thin. At noon, when
      the sun is high overhead, your shadow shrinks to a small dark pool at your
      feet. As evening comes, it stretches out long again. A shadow forms because
      your body blocks the light. Watching shadows can even tell you the time of
      day.
    questions:
      - prompt: "When is your shadow long and thin?"
        type: mc
        options: ["in the early morning", "at noon", "at midnight", "never"]
        correct_index: 0
      - prompt: "Why does a shadow form?"
        type: mc
        options: ["your body blocks the light", "the sun is cold", "the ground is dark", "the wind blows"]
        correct_index: 0
      - prompt: "Explain why your shadow is smallest at noon."
        type: written
    vocabulary:
      - word: "shadow"
        definition: "the dark shape made when something blocks light"
        context_sentence: "Your shadow is long and thin."
      - word: "shrinks"
        definition: "gets smaller"
        context_sentence: "Your shadow shrinks to a small dark pool."
      - word: "stretches"
        definition: "gets longer"
        context_sentence: "It stretches out long again."

  - title: "A Kindness Returned"
    reading_level: 4
    body: >
      One rainy afternoon, Maya shared her umbrella with a stranger at the bus
      stop. The old man thanked her warmly and went on his way. Weeks later, Maya
      dropped her purse in the busy market without noticing. A voice called out
      behind her. It was the same old man, holding out her purse. Kindness, Maya
      realised, often finds its way back to us. She never forgot that rainy day.
