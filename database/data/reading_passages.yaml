  - title: "The Honeybee"
    reading_level: 4
    body: >
      A honeybee is small, but it does a great job. It flies from flower to
      flower, drinking sweet nectar. As it moves, yellow pollen sticks to its
      body and is carried to the next bloom. This helps plants make seeds and
      fruit. Back at the hive, the bees turn the nectar into honey. Without bees,
      many of the foods we love would not grow. We should protect these busy
      little workers.
    questions:
      - prompt: "What sticks to the bee as it visits flowers?"
        type: mc
        options: ["yellow pollen", "water", "sand", "leaves"]
        correct_index: 0
      - prompt: "What do the bees make from the nectar?"
        type: mc
        options: ["honey", "wax only", "seeds", "bread"]
        correct_index: 0
      - prompt: "Explain why the passage says we should protect bees."
        type: written
    vocabulary:
