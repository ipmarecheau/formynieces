  - title: "The Recycling Club"
    reading_level: 4
    body: >
      Our school started a recycling club to keep the yard clean. We placed three
      bins: one for paper, one for plastic, and one for tins. At first, some
      students did not bother to sort their rubbish. So we made bright posters and
      gave a prize to the tidiest class. Soon everyone joined in. We sold the
      collected plastic and used the money to buy new books. Caring for the earth
      helped our school too.
