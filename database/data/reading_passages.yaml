  - title: "The Drummer Boy"
    reading_level: 4
    body: >
      Kwesi loved the sound of the steelpan more than anything. His family was
      poor and could not buy him an instrument. So each evening he practised on
      empty paint tins behind the house. He tapped out rhythms until his hands
      knew every note. A pan man heard him and offered to teach him for free.
      Years later, Kwesi led his own band at Panorama. His dream had come true
      through hard work.
