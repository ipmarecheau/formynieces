      On the muddy bank of the swamp lives the blue crab. It hides in a deep hole
      to stay safe from birds and people. When it feels the ground shake, it
      scuttles quickly back into its burrow. At night it comes out to feed. If an
      enemy grabs its claw, the crab can drop the claw and escape, growing a new
      one later. Nature has given the crab clever ways to survive.
