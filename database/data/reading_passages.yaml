      - word: "shrinks"
        definition: "gets smaller"
        context_sentence: "Your shadow shrinks to a small dark pool."
      - word: "stretches"
        definition: "gets longer"
        context_sentence: "It stretches out long again."

  - title: "A Kindness Returned"
    reading_level: 4
    body: >
      One rainy afternoon, Maya shared her umbrella with a stranger at the bus
      stop. The old man thanked her warmly and went on his way. Weeks later, Maya
      dropped her purse in the busy market without noticing. A voice called out
      behind her. It was the same old man, holding out her purse. Kindness, Maya
      realised, often finds its way back to us. She never forgot that rainy day.
