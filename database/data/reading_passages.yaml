  - title: "Grandpa's Old Radio"
    reading_level: 4
    body: >
      In the corner of Grandpa's house sits an old wooden radio. It is scratched
      and dusty, but he will not throw it away. Long ago, the whole family would
      gather around it to listen to the news and cricket. Grandpa says it once
      brought them word of important events from far away. Though we now have
      phones and televisions, he keeps the radio as a treasured memory of simpler
      times.
