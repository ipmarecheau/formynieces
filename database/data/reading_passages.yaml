# Daily reading pool (DR-06). Passages are keyed by reading level (3-7), each with
# comprehension questions and vocabulary words drawn from the passage (DV-01).
# PROVENANCE: original, authored for this platform, T&T context, SEA-aligned.
passages:

  # ── Level 3 ──
  - title: "My Dog Max"
    reading_level: 3
    body: >
      Max is my dog. He is brown and small. Every morning, Max runs to the gate
      to meet me. He wags his tail when he is happy. I give Max food and clean
      water. At night, Max sleeps close by my bed. I love my dog Max very much.
    questions:
      - prompt: "What colour is Max?"
        type: mc
        options: ["brown", "black", "white", "grey"]
        correct_index: 0
      - prompt: "Where does Max sleep at night?"
        type: mc
        options: ["by the bed", "at the gate", "on the roof", "in a tree"]
        correct_index: 0
      - prompt: "Write one thing the boy does to care for Max."
        type: written
    vocabulary:
      - word: "wags"
        definition: "moves from side to side"
        context_sentence: "He wags his tail when he is happy."
      - word: "gate"
        definition: "a door in a fence or wall"
        context_sentence: "Max runs to the gate to meet me."
      - word: "clean"
        definition: "not dirty"
        context_sentence: "I give Max food and clean water."

  - title: "A Day at the Beach"
    reading_level: 3
    body: >
      On Saturday, my family went to Maracas Beach. The sand was warm under my
      feet. I built a tall castle with a bucket. My little sister splashed in the
      waves and laughed. We ate shark and bake for lunch. The sea breeze felt
      cool and nice. It was a happy day.
    questions:
      - prompt: "Which beach did the family visit?"
        type: mc
        options: ["Maracas Beach", "Store Bay", "Mayaro", "Las Cuevas"]
        correct_index: 0
      - prompt: "What did the girl build?"
        type: mc
        options: ["a castle", "a boat", "a house", "a kite"]
        correct_index: 0
      - prompt: "Write how the sea breeze felt."
        type: written
    vocabulary:
      - word: "splashed"
        definition: "hit the water so it flew up"
        context_sentence: "My little sister splashed in the waves."
      - word: "breeze"
        definition: "a gentle wind"
        context_sentence: "The sea breeze felt cool and nice."
      - word: "warm"
        definition: "a little hot, not cold"
        context_sentence: "The sand was warm under my feet."

  - title: "The Busy Market"
    reading_level: 3
    body: >
      Every Saturday, Mummy takes me to the market. It is loud and full of
      people. We buy sweet mangoes, green figs, and fresh fish. A woman calls
      out the price of her tomatoes. The smell of pepper fills the air. I help
      Mummy carry the heavy bags home.
    questions:
      - prompt: "When do they go to the market?"
        type: mc
        options: ["every Saturday", "every Monday", "at night", "on holidays"]
        correct_index: 0
      - prompt: "What does the child help to carry?"
        type: mc
        options: ["the heavy bags", "the fish", "the money", "the baby"]
        correct_index: 0
      - prompt: "Write two things they buy at the market."
        type: written
    vocabulary:
      - word: "fresh"
        definition: "newly made or picked, not old"
        context_sentence: "We buy fresh fish at the market."
      - word: "price"
        definition: "how much money something costs"
        context_sentence: "A woman calls out the price of her tomatoes."
      - word: "heavy"
        definition: "hard to lift because it weighs a lot"
        context_sentence: "I help Mummy carry the heavy bags home."

  - title: "Rain on the Roof"
    reading_level: 3
    body: >
      The dark clouds came in the afternoon. Soon the rain began to fall. It made
      a loud drumming sound on our galvanise roof. I sat by the window and
      watched the water run down the glass. The garden looked greener after the
      rain. Then a bright rainbow filled the sky.
    questions:
      - prompt: "What sound did the rain make on the roof?"
        type: mc
        options: ["a loud drumming", "a soft whisper", "a sharp bang", "no sound"]
        correct_index: 0
      - prompt: "What appeared after the rain?"
        type: mc
        options: ["a rainbow", "the moon", "snow", "a star"]
        correct_index: 0
      - prompt: "Write how the garden looked after the rain."
        type: written
    vocabulary:
      - word: "drumming"
        definition: "a steady beating sound"
        context_sentence: "It made a loud drumming sound on the roof."
      - word: "greener"
        definition: "more green than before"
        context_sentence: "The garden looked greener after the rain."
      - word: "bright"
        definition: "full of light; easy to see"
        context_sentence: "A bright rainbow filled the sky."

  - title: "The Little Bird"
    reading_level: 3
    body: >
      A small yellow bird lives in the tree outside my house. Each morning it
      sings a sweet song. It hops from branch to branch looking for seeds. One
      day I put crumbs on the sill. The bird flew down and ate them quickly. Now
      it visits me every day.
    questions:
      - prompt: "What colour is the bird?"
        type: mc
        options: ["yellow", "blue", "red", "brown"]
        correct_index: 0
      - prompt: "What did the child put on the sill?"
        type: mc
        options: ["crumbs", "water", "a nest", "a toy"]
        correct_index: 0
      - prompt: "Write what the bird does each morning."
        type: written
    vocabulary:
      - word: "hops"
        definition: "makes small jumps"
        context_sentence: "It hops from branch to branch."
      - word: "crumbs"
        definition: "tiny bits of bread or food"
        context_sentence: "I put crumbs on the sill."
      - word: "visits"
        definition: "comes to see someone or somewhere"
        context_sentence: "Now it visits me every day."

  - title: "The Mango Tree"
    reading_level: 3
    body: >
      A big mango tree grows in our yard. In the dry season, its branches fill
      with juicy mangoes. My brother climbs up to pick the ripe ones. We share
      them with our neighbours. The sweet fruit drips down our chins. Under the
      tree, we sit in the cool shade.
    questions:
      - prompt: "When does the tree fill with mangoes?"
        type: mc
        options: ["in the dry season", "in December", "at night", "in the rain"]
        correct_index: 0
      - prompt: "Who climbs the tree to pick mangoes?"
        type: mc
        options: ["my brother", "my sister", "the neighbour", "the dog"]
        correct_index: 0
      - prompt: "Write what they do with the mangoes they pick."
        type: written
    vocabulary:
      - word: "juicy"
        definition: "full of juice"
        context_sentence: "Its branches fill with juicy mangoes."
      - word: "ripe"
        definition: "grown and ready to eat"
        context_sentence: "My brother picks the ripe ones."
      - word: "shade"
        definition: "a cool, dark place out of the sun"
        context_sentence: "We sit in the cool shade."

  - title: "The Bus Ride"
    reading_level: 3
    body: >
      Grandpa and I took the maxi to town. The seats were soft and the music
      played loudly. Through the window I saw shops, cars, and tall buildings.
      A man sold nuts at the stop. When we reached town, we walked to the park.
      The bus ride was fun.
    questions:
      - prompt: "Who went to town with the child?"
        type: mc
        options: ["Grandpa", "Mummy", "a friend", "the teacher"]
        correct_index: 0
      - prompt: "What did the man sell at the stop?"
        type: mc
        options: ["nuts", "fish", "toys", "books"]
        correct_index: 0
      - prompt: "Write one thing the child saw through the window."
        type: written
    vocabulary:
      - word: "soft"
        definition: "gentle to touch, not hard"
        context_sentence: "The seats were soft."
      - word: "loudly"
        definition: "with a lot of noise"
        context_sentence: "The music played loudly."
      - word: "reached"
        definition: "arrived at a place"
        context_sentence: "When we reached town, we walked to the park."

  - title: "The Football Game"
    reading_level: 3
    body: >
      After school, we play football on the field. I am on the red team. My
      friend Kwame kicks the ball to me. I run fast and shoot. The ball flies
      into the net. Goal! My team cheers and jumps. We win the game two to one.
    questions:
      - prompt: "Which team is the child on?"
        type: mc
        options: ["the red team", "the blue team", "the green team", "no team"]
        correct_index: 0
      - prompt: "What was the final score?"
        type: mc
        options: ["two to one", "one to one", "three to two", "zero to zero"]
        correct_index: 0
      - prompt: "Write what the team did after the goal."
        type: written
    vocabulary:
      - word: "shoot"
        definition: "to kick or throw at the goal"
        context_sentence: "I run fast and shoot."
      - word: "cheers"
        definition: "shouts happily"
        context_sentence: "My team cheers and jumps."
      - word: "win"
        definition: "to come first in a game"
        context_sentence: "We win the game two to one."

  - title: "My Little Garden"
    reading_level: 3
    body: >
      Behind our house I have a small garden. I planted seeds in the dark soil.
      Every day I water them and pull out the weeds. Slowly, tiny green shoots
      pushed up. Now I have red tomatoes and green lettuce. I feel proud when I
      pick my own food.
    questions:
      - prompt: "What did the child plant in the soil?"
        type: mc
        options: ["seeds", "flowers", "trees", "stones"]
        correct_index: 0
      - prompt: "What grew in the garden?"
        type: mc
        options: ["tomatoes and lettuce", "mangoes", "corn", "beans"]
        correct_index: 0
      - prompt: "Write two things the child does every day for the garden."
        type: written
    vocabulary:
      - word: "soil"
        definition: "the earth that plants grow in"
        context_sentence: "I planted seeds in the dark soil."
      - word: "weeds"
        definition: "wild plants you do not want"
        context_sentence: "I pull out the weeds."
      - word: "shoots"
        definition: "new little parts of a growing plant"
        context_sentence: "Tiny green shoots pushed up."

  - title: "Flying My Kite"
    reading_level: 3
    body: >
      In the windy season, I fly my kite in the savannah. My kite is red with a
      long tail. I let out the string and it climbs high into the sky. The wind
      tugs and the kite dances above the trees. I hold the string tight so it
      does not fly away.
    questions:
      - prompt: "Where does the child fly the kite?"
        type: mc
        options: ["in the savannah", "on the beach", "at home", "in a shop"]
        correct_index: 0
      - prompt: "What colour is the kite?"
        type: mc
        options: ["red", "blue", "yellow", "green"]
        correct_index: 0
      - prompt: "Write why the child holds the string tight."
        type: written
    vocabulary:
      - word: "climbs"
        definition: "goes higher"
        context_sentence: "It climbs high into the sky."
      - word: "tugs"
        definition: "pulls sharply"
        context_sentence: "The wind tugs and the kite dances."
      - word: "tight"
        definition: "held firmly, not loose"
        context_sentence: "I hold the string tight."

  - title: "My Birthday Party"
    reading_level: 3
    body: >
      Today is my birthday. I am nine years old. Mummy baked a big chocolate
      cake. My friends came to play games in the yard. We sang and danced to
      soca music. I blew out the candles and made a wish. It was the best day.
    questions:
      - prompt: "How old is the child now?"
        type: mc
        options: ["nine", "eight", "ten", "seven"]
        correct_index: 0
      - prompt: "What kind of cake did Mummy bake?"
        type: mc
        options: ["chocolate", "vanilla", "coconut", "fruit"]
        correct_index: 0
      - prompt: "Write what the child did before making a wish."
        type: written
    vocabulary:
      - word: "baked"
        definition: "cooked in an oven"
        context_sentence: "Mummy baked a big chocolate cake."
      - word: "candles"
        definition: "sticks of wax that give light when lit"
        context_sentence: "I blew out the candles."
      - word: "wish"
        definition: "a hope for something you want"
        context_sentence: "I made a wish."

  - title: "The Pet Cat"
    reading_level: 3
    body: >
      We have a soft grey cat named Smoky. She likes to nap in the sun all day.
      At night, Smoky chases moths around the lamp. She purrs when I rub her
      head. Smoky keeps the mice away from our kitchen. She is a very good cat.
    questions:
      - prompt: "What is the cat's name?"
        type: mc
        options: ["Smoky", "Max", "Tiger", "Boots"]
        correct_index: 0
      - prompt: "What does Smoky chase at night?"
        type: mc
        options: ["moths", "birds", "dogs", "cars"]
        correct_index: 0
      - prompt: "Write one useful thing Smoky does."
        type: written
    vocabulary:
      - word: "nap"
        definition: "a short sleep"
        context_sentence: "She likes to nap in the sun."
      - word: "chases"
        definition: "runs after"
        context_sentence: "Smoky chases moths around the lamp."
      - word: "purrs"
        definition: "makes a soft sound when happy"
        context_sentence: "She purrs when I rub her head."

  - title: "Fishing with Uncle"
    reading_level: 3
    body: >
      Early in the morning, Uncle took me fishing by the river. We sat quietly on
      the bank and waited. I held the rod tight. Suddenly the line pulled hard.
      I reeled it in and caught a small silver fish. Uncle smiled and said I did
      well.
    questions:
      - prompt: "Where did they go fishing?"
        type: mc
        options: ["by the river", "at the sea", "in a pond", "at the lake"]
        correct_index: 0
      - prompt: "What did the child catch?"
        type: mc
        options: ["a small silver fish", "a crab", "a big shark", "a boot"]
        correct_index: 0
      - prompt: "Write what happened when the line pulled hard."
        type: written
    vocabulary:
      - word: "bank"
        definition: "the ground at the side of a river"
        context_sentence: "We sat quietly on the bank."
      - word: "reeled"
        definition: "wound the line in to pull the fish closer"
        context_sentence: "I reeled it in and caught a fish."
      - word: "silver"
        definition: "shiny and grey-white like a coin"
        context_sentence: "I caught a small silver fish."

  - title: "Carnival Costume"
    reading_level: 3
    body: >
      For Kiddies Carnival, my mother made me a bright costume. It had blue and
      gold feathers and shiny beads. I wore it in the children's parade. We
      danced down the road to the beat of the steelpan. Everybody clapped. I felt
      like a king.
    questions:
      - prompt: "What was on the costume?"
        type: mc
        options: ["feathers and beads", "leaves and mud", "paper and glue", "wool and string"]
        correct_index: 0
      - prompt: "What did the child dance to?"
        type: mc
        options: ["the steelpan", "a drum only", "no music", "a radio"]
        correct_index: 0
      - prompt: "Write how the child felt in the costume."
        type: written
    vocabulary:
      - word: "costume"
        definition: "special clothes worn for a show or party"
        context_sentence: "My mother made me a bright costume."
      - word: "beads"
        definition: "small round shiny pieces used to decorate"
        context_sentence: "It had shiny beads."
      - word: "parade"
        definition: "a line of people moving through the streets"
        context_sentence: "I wore it in the children's parade."

  - title: "Helping Granny"
    reading_level: 3
    body: >
      On Sundays I visit my granny. She cannot walk very far now. I sweep her
      yard and water her flowers. I read her stories from my school book. Granny
      gives me a warm hug and a sweet biscuit. Helping her makes me feel good.
    questions:
      - prompt: "When does the child visit Granny?"
        type: mc
        options: ["on Sundays", "on Mondays", "every night", "on holidays"]
        correct_index: 0
      - prompt: "What does Granny give the child?"
        type: mc
        options: ["a hug and a biscuit", "money", "a toy", "a book"]
        correct_index: 0
      - prompt: "Write two ways the child helps Granny."
        type: written
    vocabulary:
      - word: "sweep"
        definition: "to clean the floor with a broom"
        context_sentence: "I sweep her yard."
      - word: "warm"
        definition: "friendly and loving"
        context_sentence: "Granny gives me a warm hug."
      - word: "visit"
        definition: "to go to see someone"
        context_sentence: "On Sundays I visit my granny."

  - title: "At the Library"
    reading_level: 3
    body: >
      Our class went to the library on Friday. It was quiet and cool inside.
      Rows and rows of books stood on the shelves. I found a book about sea
      turtles. The kind librarian helped me borrow it. I read the whole book that
      weekend.
    questions:
      - prompt: "What was the library like inside?"
        type: mc
        options: ["quiet and cool", "loud and hot", "dark and wet", "small and dusty"]
        correct_index: 0
      - prompt: "What was the child's book about?"
        type: mc
        options: ["sea turtles", "cars", "cooking", "sport"]
        correct_index: 0
      - prompt: "Write who helped the child borrow the book."
        type: written
    vocabulary:
      - word: "shelves"
        definition: "flat boards where books are kept"
        context_sentence: "Books stood on the shelves."
      - word: "librarian"
        definition: "a person who works in a library"
        context_sentence: "The kind librarian helped me."
      - word: "borrow"
        definition: "to take something for a while and give it back"
        context_sentence: "She helped me borrow it."

  - title: "The Lost Shoe"
    reading_level: 3
    body: >
      One morning I could not find my left shoe. I looked under the bed and
      behind the door. I searched in the yard and by the gate. At last, I found
      it in the dog's basket! Max had taken my shoe to sleep on. I laughed and
      hugged him.
    questions:
      - prompt: "What could the child not find?"
        type: mc
        options: ["a left shoe", "a book", "a hat", "a sock"]
        correct_index: 0
      - prompt: "Where was the shoe at last?"
        type: mc
        options: ["in the dog's basket", "under the bed", "in the yard", "by the gate"]
        correct_index: 0
      - prompt: "Write two places the child looked for the shoe."
        type: written
    vocabulary:
      - word: "searched"
        definition: "looked carefully to find something"
        context_sentence: "I searched in the yard."
      - word: "basket"
        definition: "a container to hold things"
        context_sentence: "I found it in the dog's basket."
      - word: "laughed"
        definition: "made happy sounds because something was funny"
        context_sentence: "I laughed and hugged him."

  - title: "The Hen and Her Chicks"
    reading_level: 3
    body: >
      A brown hen lives in our back yard. She sat on her eggs for many days. One
      morning, the eggs cracked open. Tiny yellow chicks stepped out. They peep
      and follow their mother everywhere. The hen keeps her chicks safe and warm
      under her wings.
    questions:
      - prompt: "What came out of the eggs?"
        type: mc
        options: ["yellow chicks", "ducks", "snakes", "birds"]
        correct_index: 0
      - prompt: "How does the hen keep the chicks warm?"
        type: mc
        options: ["under her wings", "in a box", "by the fire", "in the sun"]
        correct_index: 0
      - prompt: "Write what the chicks do all day."
        type: written
    vocabulary:
      - word: "cracked"
        definition: "broke open"
        context_sentence: "The eggs cracked open."
      - word: "peep"
        definition: "make a small high sound like a young bird"
        context_sentence: "They peep and follow their mother."
      - word: "safe"
        definition: "free from harm or danger"
        context_sentence: "The hen keeps her chicks safe."

  - title: "A New Friend"
    reading_level: 3
    body: >
      A new girl joined our class today. Her name is Amara and she looked shy. At
      lunch, she sat alone. I went over and shared my snack with her. We talked
      and soon we were laughing together. Now Amara is my good friend.
    questions:
      - prompt: "What is the new girl's name?"
        type: mc
        options: ["Amara", "Maya", "Reena", "Ava"]
        correct_index: 0
      - prompt: "What did the child share with her?"
        type: mc
        options: ["a snack", "a book", "a pen", "a toy"]
        correct_index: 0
      - prompt: "Write how Amara looked when she joined the class."
        type: written
    vocabulary:
