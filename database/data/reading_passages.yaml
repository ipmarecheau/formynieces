        definition: "became part of a group"
        context_sentence: "A new girl joined our class."
      - word: "shy"
        definition: "nervous around new people"
        context_sentence: "She looked shy."
      - word: "shared"
        definition: "gave a part to someone else"
        context_sentence: "I shared my snack with her."

  - title: "The Night Sky"
    reading_level: 3
    body: >
      At night, my father and I sit on the step and look up. The sky is dark and
      full of tiny stars. The moon glows bright and round. My father points out
      shapes made by the stars. A cool breeze blows. I feel small under the huge
      sky.
    questions:
      - prompt: "When do they look at the sky?"
        type: mc
        options: ["at night", "in the morning", "at noon", "in the rain"]
        correct_index: 0
      - prompt: "How does the moon look?"
        type: mc
        options: ["bright and round", "small and dark", "red", "square"]
        correct_index: 0
      - prompt: "Write what the father points out in the sky."
        type: written
    vocabulary:
      - word: "glows"
        definition: "shines with a soft light"
        context_sentence: "The moon glows bright and round."
      - word: "points"
        definition: "shows where something is with a finger"
        context_sentence: "My father points out shapes."
      - word: "huge"
        definition: "very, very big"
        context_sentence: "I feel small under the huge sky."

  - title: "Washing the Car"
    reading_level: 3
    body: >
      On Saturday, Daddy and I washed the car. We filled a bucket with soapy
      water. I scrubbed the wheels while Daddy cleaned the top. Water splashed
      everywhere and we got wet. When we finished, the car was shiny and clean.
      Daddy said thank you.
    questions:
      - prompt: "What did they fill the bucket with?"
        type: mc
        options: ["soapy water", "sand", "oil", "juice"]
        correct_index: 0
      - prompt: "What part did the child scrub?"
        type: mc
        options: ["the wheels", "the top", "the seats", "the glass"]
        correct_index: 0
      - prompt: "Write how the car looked when they finished."
        type: written
    vocabulary:
      - word: "bucket"
        definition: "a round container with a handle for carrying water"
        context_sentence: "We filled a bucket with soapy water."
      - word: "scrubbed"
        definition: "rubbed hard to clean"
        context_sentence: "I scrubbed the wheels."
      - word: "shiny"
        definition: "bright and clean, reflecting light"
        context_sentence: "The car was shiny and clean."

  - title: "The Thunderstorm"
    reading_level: 3
    body: >
      Last night a big storm came. The wind howled and bent the trees. Bright
      lightning flashed across the sky. Then a loud clap of thunder made me jump.
      I hid under my blanket until it passed. In the morning, the sun came out
      again.
    questions:
      - prompt: "What made the child jump?"
        type: mc
        options: ["the thunder", "the rain", "the dog", "the wind only"]
        correct_index: 0
      - prompt: "Where did the child hide?"
        type: mc
        options: ["under the blanket", "in the yard", "on the roof", "by the gate"]
        correct_index: 0
      - prompt: "Write what the wind did to the trees."
        type: written
    vocabulary:
      - word: "howled"
        definition: "made a long, loud sound"
        context_sentence: "The wind howled and bent the trees."
      - word: "lightning"
        definition: "a bright flash of light in a storm"
        context_sentence: "Bright lightning flashed across the sky."
      - word: "passed"
        definition: "came to an end and went away"
        context_sentence: "I hid until it passed."

  - title: "Making Roti"
    reading_level: 3
    body: >
      My aunty makes roti on Sunday. She mixes flour and water into soft dough.
      She rolls it flat and round. Then she cooks it on the hot tawah. The kitchen
      smells warm and sweet. I love to eat fresh roti with curry.
    questions:
      - prompt: "What does aunty mix to make dough?"
        type: mc
        options: ["flour and water", "sugar and salt", "rice and peas", "milk and eggs"]
        correct_index: 0
      - prompt: "What does she cook the roti on?"
        type: mc
        options: ["a hot tawah", "a pot", "a plate", "the fire"]
        correct_index: 0
      - prompt: "Write what the child eats with the roti."
        type: written
    vocabulary:
      - word: "mixes"
        definition: "stirs things together"
        context_sentence: "She mixes flour and water."
      - word: "dough"
        definition: "a soft mix of flour and water before cooking"
        context_sentence: "She mixes flour and water into soft dough."
      - word: "flat"
        definition: "smooth and level, not thick"
        context_sentence: "She rolls it flat and round."

  - title: "The School Trip"
    reading_level: 3
    body: >
      Our class went on a trip to the zoo. We saw a big lazy lion and tall
      giraffes. Colourful parrots called out from the trees. My favourite was the
      cheeky monkey that clapped its hands. We ate our lunch under a shady tree.
