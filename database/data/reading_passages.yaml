  - title: "The Cricket Match"
    reading_level: 4
    body: >
      It was the last over of the village match. Our team needed six runs to win.
      Everyone held their breath as Devon walked to the crease. The bowler ran in
      fast. Devon watched the ball closely, swung, and struck it high over the
      boundary. A mighty six! The crowd leapt up, cheering wildly. Devon had won
      the match with the last ball. He would be talked about for weeks.
