  - title: "The Missing Lunch"
    reading_level: 4
    body: >
      At break time, Anisa reached into her bag, but her lunch was gone. She was
      sure someone had taken it. She looked at Jaden with an angry face. But then
      she remembered leaving her lunch bag on the kitchen table that morning. She
      had been quick to blame without knowing the truth. Anisa said sorry to
      Jaden, and he shared his roti with her. She learned to be sure before
      accusing anyone.
