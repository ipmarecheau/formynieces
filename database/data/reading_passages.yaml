        definition: "a person who starts a business"
        context_sentence: "The young entrepreneur wanted a bicycle."
      - word: "records"
        definition: "written notes kept for information"
        context_sentence: "She kept careful records."
      - word: "earned"
        definition: "got money in return for work"
        context_sentence: "Records of what she spent and earned."

  - title: "The Silent Language"
    reading_level: 5
    body: >
      Not all messages are spoken with words. A smile can welcome a stranger, and
      a frown can warn of anger. Crossed arms may show that a person feels closed
      off, while a gentle nod says 'I am listening'. This is called body language,
      and we use it every day without noticing. Sometimes what a person does with
      their face and hands tells us more than what they say aloud. Learning to
      read this silent language helps us understand others and treat them with
      care.
    questions:
      - prompt: "What is 'body language'?"
        type: mc
        options: ["messages sent without words, through the body", "a foreign language", "sign writing", "a secret code"]
        correct_index: 0
      - prompt: "What might crossed arms show?"
        type: mc
        options: ["that a person feels closed off", "that a person is cold only", "that a person is tired", "that a person is happy"]
        correct_index: 0
      - prompt: "Explain how reading body language 'helps us treat others with care'."
        type: written
    vocabulary:
      - word: "frown"
        definition: "a face that shows anger or worry"
        context_sentence: "A frown can warn of anger."
      - word: "gesture"
        definition: "a movement of the body that carries meaning"
        context_sentence: "A gentle nod is a gesture that says 'I am listening'."
      - word: "notice"
        definition: "to become aware of something"
        context_sentence: "We use it without noticing."

  - title: "The Weather Watcher"
    reading_level: 5
    body: >
      Long before television forecasts, farmers and fishermen read the sky itself.
      A red sky at dusk often promised fair weather to come, while a ring around
      the moon warned of rain. They watched how the birds flew low and how the
      ants hurried to higher ground before a storm. These signs were passed down
      through the generations and rarely failed. Even today, science confirms that
      many of these old observations were remarkably accurate. Nature, it turns
      out, gives clear warnings to those who learn to look.
    questions:
      - prompt: "What did a ring around the moon warn of?"
        type: mc
        options: ["rain", "sunshine", "wind only", "an eclipse"]
        correct_index: 0
      - prompt: "How were these weather signs passed on?"
        type: mc
        options: ["through the generations", "written in books", "on the radio", "by the government"]
        correct_index: 0
      - prompt: "Explain what is meant by 'Nature gives clear warnings to those who learn to look'."
        type: written
    vocabulary:
      - word: "forecasts"
        definition: "statements about what the weather will be"
        context_sentence: "Long before television forecasts."
      - word: "observations"
        definition: "things noticed by watching carefully"
        context_sentence: "Many of these old observations were accurate."
      - word: "accurate"
        definition: "correct and exact"
        context_sentence: "The observations were remarkably accurate."

  # ── Level 6 ──
  - title: "A Warming World"
    reading_level: 6
    body: >
      Scientists around the globe agree that the earth is slowly growing warmer.
      When we burn coal, oil, and gas for energy, we release gases that trap heat
      in the atmosphere, much like a blanket wrapped around the planet. As
      temperatures rise, ice at the poles melts, sea levels creep higher, and
      weather grows more extreme. For small island nations like ours, this is not
      a distant threat but a present danger. The encouraging news is that solutions
      exist. By using cleaner energy, protecting forests, and wasting less, humanity
      can still slow the warming and safeguard the world for future generations.
    questions:
      - prompt: "What happens when we burn coal, oil, and gas?"
        type: mc
        options: ["gases are released that trap heat", "the earth cools", "rain increases", "ice grows"]
        correct_index: 0
      - prompt: "Why is warming described as 'a present danger' for island nations?"
        type: mc
        options: ["rising seas and extreme weather threaten them now", "they burn the most fuel", "they have no forests", "they are far away"]
        correct_index: 0
      - prompt: "Explain the comparison of the trapped gases to 'a blanket wrapped around the planet'."
        type: written
    vocabulary:
      - word: "atmosphere"
        definition: "the layer of gases surrounding the earth"
        context_sentence: "Gases trap heat in the atmosphere."
      - word: "extreme"
        definition: "far greater than usual; severe"
        context_sentence: "Weather grows more extreme."
      - word: "safeguard"
        definition: "to protect from harm"
        context_sentence: "Humanity can safeguard the world for the future."

  - title: "The First Peoples"
    reading_level: 6
    body: >
      Long before European ships appeared on the horizon, the islands were home to
      the First Peoples, the Amerindians. They lived in harmony with the land,
      fishing the rivers, hunting in the forests, and cultivating cassava and
      maize. They were skilled potters and boat-builders, travelling between
      islands in canoes carved from single trees. Much of their language survives
      in the names of our places and plants. Though their numbers dwindled after
      colonisation, their descendants and their legacy endure. To understand our
      nation fully, we must first honour those who walked this land before all
      others.
    questions:
      - prompt: "How did the First Peoples travel between islands?"
        type: mc
        options: ["in canoes carved from single trees", "on rafts of reeds", "by swimming", "on large ships"]
        correct_index: 0
      - prompt: "Where does much of their language survive today?"
        type: mc
        options: ["in the names of places and plants", "in old songs only", "in one village", "nowhere"]
        correct_index: 0
      - prompt: "Explain why the writer says we must 'honour those who walked this land before all others'."
        type: written
    vocabulary:
      - word: "cultivating"
        definition: "growing crops by preparing and working the land"
        context_sentence: "Fishing the rivers and cultivating cassava."
      - word: "dwindled"
        definition: "became smaller in number"
        context_sentence: "Their numbers dwindled after colonisation."
      - word: "legacy"
        definition: "something handed down from the past"
        context_sentence: "Their descendants and their legacy endure."

  - title: "How Plants Make Food"
    reading_level: 6
    body: >
      Unlike animals, plants make their own food in a remarkable process called
      photosynthesis. Inside their leaves lies a green substance called
      chlorophyll, which captures the energy of sunlight. Using this energy, the
      plant combines water drawn up through its roots with carbon dioxide taken
      from the air. From these simple ingredients it produces sugar for food and
      releases oxygen as a by-product. In this quiet, invisible way, plants feed
      themselves, feed the animals that eat them, and fill the air with the oxygen
      that nearly all life depends upon. They are the green engines of our world.
    questions:
      - prompt: "What does chlorophyll do in the leaf?"
        type: mc
        options: ["captures the energy of sunlight", "stores water", "gives the plant its smell", "keeps out insects"]
        correct_index: 0
      - prompt: "What gas do plants release during photosynthesis?"
        type: mc
        options: ["oxygen", "carbon dioxide", "smoke", "steam"]
        correct_index: 0
      - prompt: "Explain why the writer calls plants 'the green engines of our world'."
        type: written
    vocabulary:
      - word: "photosynthesis"
        definition: "the way green plants make food using sunlight"
        context_sentence: "A remarkable process called photosynthesis."
      - word: "captures"
        definition: "takes hold of and keeps"
        context_sentence: "Chlorophyll captures the energy of sunlight."
      - word: "by-product"
        definition: "something extra made while producing another thing"
        context_sentence: "It releases oxygen as a by-product."

  - title: "The Found Treasure"
    reading_level: 6
    body: >
      While clearing an old field, two workers unearthed a clay pot filled with
      ancient coins. Word spread quickly, and soon many people claimed the treasure
      was theirs. The landowner said it was found on his property; the workers said
      their labour had uncovered it; the government said such antiquities belonged
      to the nation's heritage. A wise magistrate reminded them that some things are
      too valuable to belong to any one person. In the end, the coins were placed
      in a museum, where thousands could learn from them, and the finders were
      honoured for their honesty in reporting the discovery.
    questions:
      - prompt: "What did the two workers unearth?"
        type: mc
        options: ["a clay pot filled with ancient coins", "a chest of gold", "old bones", "a buried house"]
        correct_index: 0
      - prompt: "Where were the coins finally placed?"
        type: mc
        options: ["in a museum", "with the landowner", "back in the field", "with the workers"]
        correct_index: 0
      - prompt: "Explain the magistrate's idea that 'some things are too valuable to belong to any one person'."
        type: written
    vocabulary:
      - word: "unearthed"
        definition: "dug up from the ground"
        context_sentence: "Two workers unearthed a clay pot."
      - word: "antiquities"
        definition: "objects from ancient times"
        context_sentence: "Such antiquities belonged to the nation's heritage."
      - word: "heritage"
        definition: "the history and traditions passed down to a people"
        context_sentence: "It belonged to the nation's heritage."

  - title: "The Journey of the Birds"
    reading_level: 6
    body: >
      Each year, as the northern lands grow cold, millions of birds embark on an
      extraordinary journey southward. Some travel thousands of kilometres,
      crossing oceans and deserts to reach warmer feeding grounds. How they find
      their way remains one of nature's great mysteries. Scientists believe the
      birds navigate using the position of the sun and stars, and can even sense
      the earth's magnetic field like a living compass. Guided by instincts older
      than memory, they return to the very same places year after year. Their
      migration reminds us how much of the natural world we have yet to understand.
    questions:
      - prompt: "Why do the birds travel southward each year?"
        type: mc
        options: ["to reach warmer feeding grounds", "to escape other birds", "to find water only", "to lay eggs at sea"]
        correct_index: 0
      - prompt: "How do scientists believe the birds navigate?"
        type: mc
        options: ["by the sun, stars, and earth's magnetic field", "by following roads", "by chance", "by following ships"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'instincts older than memory'."
        type: written
    vocabulary:
      - word: "embark"
        definition: "to begin a journey"
        context_sentence: "Millions of birds embark on a journey southward."
      - word: "navigate"
        definition: "to find the way from one place to another"
        context_sentence: "The birds navigate using the sun and stars."
      - word: "instincts"
        definition: "natural ways of behaving that are not learned"
        context_sentence: "Guided by instincts older than memory."

  - title: "The Two-Edged Screen"
    reading_level: 6
    body: >
      The smartphone has transformed the way we live. In an instant we can speak to
      relatives across the world, look up any fact, and carry a library in our
      pocket. Yet this powerful tool has two edges. Spending hours scrolling can
      steal time from sleep, study, and real conversation. Some people grow anxious
      when parted from their devices, and false information can spread as easily as
      true. The screen itself is neither good nor evil; what matters is how wisely
      we choose to use it. Mastering our tools, rather than being mastered by them,
      is the challenge of our age.
    questions:
      - prompt: "What does the writer mean by the smartphone having 'two edges'?"
        type: mc
        options: ["it can help and harm depending on use", "it has two screens", "it cuts things", "it needs two hands"]
        correct_index: 0
      - prompt: "What can spread as easily as true information?"
        type: mc
        options: ["false information", "kindness", "music", "money"]
        correct_index: 0
      - prompt: "Explain the challenge of 'mastering our tools, rather than being mastered by them'."
        type: written
    vocabulary:
      - word: "transformed"
        definition: "changed completely"
        context_sentence: "The smartphone has transformed the way we live."
      - word: "anxious"
        definition: "worried and uneasy"
        context_sentence: "Some people grow anxious without their devices."
      - word: "mastering"
        definition: "gaining full control or skill over something"
        context_sentence: "Mastering our tools is the challenge of our age."

  - title: "The Power of Forgiveness"
    reading_level: 6
    body: >
      When his rival spread cruel lies about him, Marcus burned with anger and
      dreamed of revenge. For weeks the bitterness gnawed at him, robbing him of
      sleep and joy. Then a wise aunt told him that holding on to hatred is like
      drinking poison and expecting the other person to suffer. Slowly, Marcus
      chose to let the anger go, not because his rival deserved forgiveness, but
      because he himself deserved peace. The weight lifted from his heart. He
      learned that forgiveness is not a gift we give to others so much as a
      freedom we grant ourselves.
    questions:
      - prompt: "What did the bitterness do to Marcus?"
        type: mc
        options: ["robbed him of sleep and joy", "made him rich", "helped him win", "made him famous"]
        correct_index: 0
      - prompt: "Why did Marcus finally let the anger go?"
        type: mc
        options: ["because he himself deserved peace", "his rival apologised", "he forgot about it", "he was told to"]
        correct_index: 0
      - prompt: "Explain the saying that 'holding on to hatred is like drinking poison'."
        type: written
    vocabulary:
      - word: "rival"
        definition: "a person competing against another"
        context_sentence: "His rival spread cruel lies."
      - word: "bitterness"
        definition: "a deep, angry, unhappy feeling"
        context_sentence: "The bitterness gnawed at him."
      - word: "forgiveness"
        definition: "the act of letting go of anger toward someone"
        context_sentence: "Forgiveness is a freedom we grant ourselves."

  - title: "The Restless Earth"
    reading_level: 6
    body: >
      Deep beneath our feet, the earth is far from still. Its outer shell is broken
      into enormous slabs of rock called plates, which drift slowly over hot,
      molten rock below. Where these plates grind against one another, pressure
      builds over many years. When it is suddenly released, the ground shudders in
      an earthquake. In some places, molten rock forces its way to the surface and
      erupts as a volcano. Though these events can be destructive, they also build
      mountains and enrich the soil. The planet we walk upon is not a finished
      thing, but a world forever being remade.
    questions:
      - prompt: "What are the enormous slabs of rock in the earth's shell called?"
        type: mc
        options: ["plates", "cores", "crusts", "beds"]
        correct_index: 0
      - prompt: "What causes an earthquake, according to the passage?"
        type: mc
        options: ["the sudden release of built-up pressure between plates", "heavy rain", "strong wind", "the moon"]
        correct_index: 0
      - prompt: "Explain the idea that the earth is 'a world forever being remade'."
        type: written
    vocabulary:
      - word: "molten"
        definition: "melted by great heat"
        context_sentence: "The plates drift over hot, molten rock."
      - word: "erupts"
        definition: "bursts out violently"
        context_sentence: "Molten rock erupts as a volcano."
      - word: "destructive"
        definition: "causing great damage"
        context_sentence: "These events can be destructive."

  - title: "Medicine from the Forest"
    reading_level: 6
    body: >
      For centuries, the people of the Caribbean have used the plants around them
      to heal the sick. A bush tea might ease a fever; the sap of a certain leaf
      might soothe a wound. This knowledge, gathered over generations, is a kind of
      living library. Today scientists study these traditional remedies, and many
      modern medicines have their roots in forest plants. Yet as forests are cut
      down, some plants disappear before their secrets can be learned. Protecting
      the wild is therefore not only about beauty; it may hold cures for diseases
      we have not yet defeated.
    questions:
      - prompt: "How was the knowledge of plant medicines gathered?"
        type: mc
        options: ["over generations", "in a single year", "from books abroad", "by accident once"]
        correct_index: 0
      - prompt: "Why might some plant cures be lost forever?"
        type: mc
        options: ["forests are cut down before the plants are studied", "no one is interested", "the plants move", "medicine is banned"]
        correct_index: 0
      - prompt: "Explain why the writer calls traditional knowledge 'a living library'."
        type: written
    vocabulary:
      - word: "remedies"
        definition: "things used to cure illness"
        context_sentence: "Scientists study these traditional remedies."
      - word: "traditional"
        definition: "based on long-established custom"
        context_sentence: "Many medicines have roots in traditional remedies."
      - word: "defeated"
        definition: "overcome; beaten"
        context_sentence: "Diseases we have not yet defeated."

  - title: "The True Test of a Leader"
    reading_level: 6
    body: >
      When the team was winning, everyone wanted to be captain. But when they lost
      three matches in a row and spirits sank, only Denise stepped forward. She did
      not blame her teammates or make excuses. Instead she encouraged the weakest
      players, took responsibility for mistakes, and reminded everyone why they
      loved the game. Slowly, confidence returned, and so did their victories. The
      coach observed that anyone can lead in easy times; the true test of a leader
      is how they carry others through hardship. Real leadership, he said, is
      measured not by glory, but by service.
    questions:
      - prompt: "When did Denise step forward to lead?"
        type: mc
        options: ["when the team was losing and spirits sank", "when they were winning", "at the awards ceremony", "when she was asked"]
        correct_index: 0
      - prompt: "What did Denise do instead of blaming her teammates?"
        type: mc
        options: ["encouraged them and took responsibility", "quit the team", "argued with the coach", "played alone"]
        correct_index: 0
      - prompt: "Explain the coach's belief that leadership is 'measured not by glory, but by service'."
        type: written
    vocabulary:
      - word: "responsibility"
        definition: "the duty to answer for something"
        context_sentence: "She took responsibility for mistakes."
      - word: "confidence"
        definition: "belief in one's own ability"
        context_sentence: "Slowly, confidence returned."
      - word: "service"
        definition: "the act of helping others"
        context_sentence: "Leadership is measured by service."

  - title: "Power from Nature"
    reading_level: 6
    body: >
      For most of history, humans burned wood and later coal and oil to power their
      lives. But these fuels pollute the air and will one day run out. Now, engineers
      are turning to sources that nature renews endlessly. Great turbines spin in the
      wind, panels drink in the energy of the tropical sun, and dams harness the
      force of falling water. In a land as blessed with sunshine as ours, the
      possibilities are enormous. Renewable energy promises not only cleaner air but
      also a future that does not depend on burning what cannot be replaced.
    questions:
      - prompt: "What is a problem with fuels like coal and oil?"
        type: mc
        options: ["they pollute the air and will run out", "they are too cheap", "they make no heat", "they are new"]
        correct_index: 0
      - prompt: "Which renewable source is described as especially suited to our land?"
        type: mc
        options: ["the tropical sun", "coal", "falling snow", "geothermal steam"]
        correct_index: 0
      - prompt: "Explain why renewable energy 'does not depend on burning what cannot be replaced'."
        type: written
    vocabulary:
      - word: "pollute"
        definition: "to make dirty or harmful"
        context_sentence: "These fuels pollute the air."
      - word: "turbines"
        definition: "machines with blades turned by wind or water to make power"
        context_sentence: "Great turbines spin in the wind."
      - word: "renewable"
        definition: "able to be replaced by nature; not used up"
        context_sentence: "Renewable energy promises cleaner air."

  - title: "The Strength of the Team"
    reading_level: 6
    body: >
      Why can a group achieve what no single person can? Part of the answer lies in
      how people combine their different strengths. One member may be creative,
      another careful, a third good at encouraging the rest. When they trust one
      another and share a common goal, the whole becomes greater than the sum of its
      parts. But teamwork is not automatic; it requires listening, compromise, and
      the humility to admit when someone else has a better idea. The finest teams are
      not simply collections of talented individuals, but groups who have learned to
      pull together as one.
    questions:
      - prompt: "Why can a group achieve what a single person cannot?"
        type: mc
        options: ["people combine their different strengths", "there are more of them to shout", "one person does everything", "they work less"]
        correct_index: 0
      - prompt: "What does teamwork require, according to the passage?"
        type: mc
        options: ["listening, compromise, and humility", "one strong leader only", "silence", "competition"]
        correct_index: 0
      - prompt: "Explain the phrase 'the whole becomes greater than the sum of its parts'."
        type: written
    vocabulary:
      - word: "combine"
        definition: "to join together"
        context_sentence: "People combine their different strengths."
      - word: "compromise"
        definition: "an agreement where each side gives up a little"
        context_sentence: "Teamwork requires listening and compromise."
      - word: "humility"
        definition: "the quality of not being proud; modesty"
        context_sentence: "The humility to admit a better idea."

  - title: "The Vanishing Ocelot"
    reading_level: 6
    body: >
      Deep in the forests of Trinidad prowls the ocelot, a beautiful spotted wild
      cat. Once common, it is now rarely seen. As people clear the forest for farms
      and houses, the ocelot loses the cover it needs to hunt and hide. Some are
      killed for their striking fur or because they take a farmer's chickens. Each
      creature lost weakens the delicate web of forest life, for the ocelot helps
      keep the numbers of rats and other small animals in check. Conservationists
      now work to protect the remaining forest, hoping the ocelot's soft footsteps
      will not vanish from our land forever.
    questions:
      - prompt: "Why is the ocelot now rarely seen?"
        type: mc
        options: ["people clear the forest it needs", "it moved to the city", "it sleeps all day", "it left the island"]
        correct_index: 0
      - prompt: "How does the ocelot help the forest?"
        type: mc
        options: ["it keeps the numbers of rats and small animals in check", "it plants trees", "it cleans rivers", "it scares tourists"]
        correct_index: 0
      - prompt: "Explain how losing the ocelot could 'weaken the delicate web of forest life'."
        type: written
    vocabulary:
      - word: "prowls"
        definition: "moves about quietly, hunting"
        context_sentence: "The ocelot prowls the forests of Trinidad."
      - word: "striking"
        definition: "very noticeable or impressive"
        context_sentence: "Some are killed for their striking fur."
      - word: "conservationists"
        definition: "people who work to protect nature"
        context_sentence: "Conservationists work to protect the forest."

  - title: "The Meaning of Home"
    reading_level: 6
    body: >
      When her family moved abroad for work, Priya thought she had lost her home
      forever. In the cold new city, everything felt strange and grey. Yet as the
      months passed, she discovered that home was not only a place on a map. It
      lived in the smell of her mother's cooking, in the language they spoke around
      the table, in the songs and stories they carried with them. She began to
      teach her new friends about her island, and in sharing it, she felt it grow
      stronger inside her. Home, she realised, is something we carry in the heart as
      much as we stand upon with our feet.
    questions:
      - prompt: "What did Priya first believe when her family moved abroad?"
        type: mc
        options: ["that she had lost her home forever", "that she would be rich", "that she would return soon", "that she would forget her island"]
        correct_index: 0
      - prompt: "Where did Priya discover home still 'lived'?"
        type: mc
        options: ["in cooking, language, songs, and stories", "in the new city's shops", "in photographs only", "in her old house"]
        correct_index: 0
      - prompt: "Explain the idea that 'home is something we carry in the heart'."
        type: written
    vocabulary:
      - word: "abroad"
        definition: "in a foreign country"
        context_sentence: "Her family moved abroad for work."
      - word: "discovered"
        definition: "found out for the first time"
        context_sentence: "She discovered that home was not only a place."
      - word: "realised"
        definition: "came to understand"
        context_sentence: "Home, she realised, is carried in the heart."

  - title: "The Language of Bees"
    reading_level: 6
    body: >
      When a honeybee discovers a rich patch of flowers, it does not keep the news
      to itself. Returning to the hive, it performs a curious 'waggle dance',
      moving in a figure-eight pattern across the honeycomb. The angle of the dance
      tells the other bees the direction of the flowers in relation to the sun,
      while its length reveals how far away they are. Through this silent dance, one
      bee can guide hundreds of others straight to the food. Scientists marvel that
      such a tiny creature can share such precise information without a single word.
    questions:
      - prompt: "What does the bee's 'waggle dance' tell the other bees?"
        type: mc
        options: ["the direction and distance of the flowers", "the colour of the flowers", "the time of day", "the weather"]
        correct_index: 0
      - prompt: "How does the length of the dance help the other bees?"
        type: mc
        options: ["it reveals how far away the flowers are", "it shows the flower's size", "it names the flower", "it counts the bees"]
        correct_index: 0
      - prompt: "Explain why scientists 'marvel' at the bee's dance."
        type: written
    vocabulary:
      - word: "performs"
        definition: "carries out an action for others to see"
        context_sentence: "It performs a curious waggle dance."
      - word: "reveals"
        definition: "makes something known"
        context_sentence: "Its length reveals how far away they are."
      - word: "precise"
        definition: "exact and accurate"
        context_sentence: "It can share such precise information."

  - title: "Rebuilding the Reef"
    reading_level: 6
    body: >
      When a coral reef is damaged, it can take decades to recover on its own. But
      marine scientists have found clever ways to help. In underwater nurseries,
      they grow small pieces of healthy coral on frames, tending them like a garden.
      Once the fragments are strong, divers carefully attach them to the damaged
      reef, where they slowly spread and heal the wound. The work is painstaking and
      slow, one coral at a time, yet already fish are returning to reefs once thought
      lost. It is a hopeful reminder that with patience and effort, even great damage
      can be undone.
    questions:
      - prompt: "How do scientists grow new coral?"
        type: mc
        options: ["on frames in underwater nurseries", "in ordinary fish tanks", "on the beach", "in the open sea only"]
        correct_index: 0
      - prompt: "What sign shows the restored reefs are recovering?"
        type: mc
        options: ["fish are returning", "the water turns blue", "the coral turns white", "the divers leave"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'even great damage can be undone'."
        type: written
    vocabulary:
      - word: "nurseries"
        definition: "places where young plants or creatures are grown and cared for"
        context_sentence: "They grow coral in underwater nurseries."
      - word: "fragments"
        definition: "small broken pieces"
        context_sentence: "Once the fragments are strong, divers attach them."
      - word: "painstaking"
        definition: "done with great care and effort"
        context_sentence: "The work is painstaking and slow."

  - title: "The Sound of the Nation"
    reading_level: 6
    body: >
      Calypso is far more than catchy music; it is the voice of a people. Born in
      the days of struggle, the calypsonian used clever, witty lyrics to comment on
      the news, to mock the powerful, and to speak truths that could not be said
      plainly. Wrapped in humour and rhythm, a calypso could carry a sharp message
      that made listeners both laugh and think. Through wars, elections, and hard
      times, the calypsonian has held up a mirror to society. To this day, a great
      calypso can change minds where a plain speech would fail.
    questions:
      - prompt: "How did the calypsonian comment on the powerful?"
        type: mc
        options: ["through clever, witty lyrics", "with silence", "by writing letters", "with long speeches"]
        correct_index: 0
      - prompt: "What could a calypso make listeners do?"
        type: mc
        options: ["both laugh and think", "only dance", "fall asleep", "grow angry only"]
        correct_index: 0
      - prompt: "Explain what is meant by the calypsonian holding 'a mirror to society'."
        type: written
    vocabulary:
      - word: "witty"
        definition: "clever and amusing"
        context_sentence: "The calypsonian used witty lyrics."
      - word: "mock"
        definition: "to make fun of"
        context_sentence: "To mock the powerful."
      - word: "society"
        definition: "the people living together in a community"
        context_sentence: "A mirror to society."

  - title: "The Water Beneath Us"
    reading_level: 6
    body: >
      Not all the world's fresh water flows in rivers and lakes. Vast amounts lie
      hidden underground, soaked into layers of rock and sand called aquifers. Rain
      seeps slowly down over many years to fill these hidden stores. Wells and
      pumps draw the water up for drinking and farming. But if we take it out faster
      than the rain replaces it, the underground stores shrink, and in coastal areas
      salty sea water can creep in to spoil what remains. This invisible resource is
      precious, and using it wisely today ensures there will be water for tomorrow.
    questions:
      - prompt: "What are the underground layers of rock and sand that hold water called?"
        type: mc
        options: ["aquifers", "reservoirs", "glaciers", "wetlands"]
        correct_index: 0
      - prompt: "What can happen in coastal areas if too much water is taken out?"
        type: mc
        options: ["salty sea water can creep in", "the ground rises", "rivers dry up at once", "the water turns hot"]
        correct_index: 0
      - prompt: "Explain why the writer calls underground water 'precious'."
        type: written
    vocabulary:
      - word: "aquifers"
        definition: "underground layers of rock that hold water"
        context_sentence: "Water lies in aquifers underground."
      - word: "seeps"
        definition: "flows slowly through small openings"
        context_sentence: "Rain seeps slowly down."
      - word: "resource"
        definition: "a useful supply that people can draw on"
        context_sentence: "This invisible resource is precious."

  - title: "Creatures of Habit"
    reading_level: 6
    body: >
      Much of what we do each day, we do without thinking. Brushing our teeth,
      taking the same route to school, reaching for a snack when bored: these are
      habits, actions repeated so often they become automatic. Habits can serve us
      well, saving effort for harder tasks, or they can quietly harm us. The good
      news is that habits can be changed. By repeating a new action again and again,
      especially at the same time or place, we can slowly wear a new groove into our
      routine. We are, in large part, the sum of the small things we do every day.
    questions:
      - prompt: "What makes an action become a habit?"
        type: mc
        options: ["repeating it so often it becomes automatic", "doing it once", "being told to do it", "reading about it"]
        correct_index: 0
      - prompt: "How can a new habit be built?"
        type: mc
        options: ["by repeating a new action again and again", "by wishing for it", "by writing it down once", "by forgetting the old one"]
        correct_index: 0
      - prompt: "Explain the idea that 'we are the sum of the small things we do every day'."
        type: written
    vocabulary:
      - word: "automatic"
        definition: "done without conscious thought"
        context_sentence: "Actions repeated so often they become automatic."
      - word: "routine"
        definition: "a regular, fixed way of doing things"
        context_sentence: "We wear a new groove into our routine."
      - word: "repeated"
        definition: "done again and again"
        context_sentence: "Actions repeated so often become habits."

  - title: "Guarding the Truth"
    reading_level: 6
    body: >
      Devika worked for a company that was quietly dumping waste into the river. She
      knew that speaking out could cost her the job she needed. For weeks she
      wrestled with fear and duty. In the end, she gathered proof and reported the
      wrongdoing to the authorities. It was not easy: some called her a traitor, and
      she lost friends. But the dumping stopped, and the river slowly grew clean
      again. To stand up for what is right when it is difficult and unpopular is one
      of the hardest and most important kinds of courage.
    questions:
      - prompt: "What wrongdoing did Devika discover?"
        type: mc
        options: ["the company was dumping waste into the river", "workers were underpaid", "the products were fake", "money was stolen"]
        correct_index: 0
      - prompt: "What was the result of her speaking out?"
        type: mc
        options: ["the dumping stopped and the river grew clean", "nothing changed", "she was promoted", "the river dried up"]
        correct_index: 0
      - prompt: "Explain why standing up for the truth was 'one of the hardest kinds of courage'."
        type: written
    vocabulary:
      - word: "wrestled"
        definition: "struggled with a difficult problem or feeling"
        context_sentence: "She wrestled with fear and duty."
      - word: "authorities"
        definition: "people or groups with the power to make decisions"
        context_sentence: "She reported the wrongdoing to the authorities."
      - word: "unpopular"
        definition: "not liked or approved of by many"
        context_sentence: "To stand up when it is difficult and unpopular."

  - title: "The Body's Defenders"
    reading_level: 6
    body: >
      Inside your body, an unseen army is always on guard. This is your immune
      system, a network of cells that hunts down harmful germs. When a new disease
      appears, the body must learn to recognise it, which takes precious time.
      Vaccines offer a clever shortcut. A vaccine shows the immune system a harmless
      piece of a germ, so the body learns to defeat it in advance. Then, if the real
      disease ever arrives, the defenders are ready and strike at once. Through
      vaccines, millions of lives have been saved from illnesses that once killed
      without mercy.
    questions:
      - prompt: "What is the immune system?"
        type: mc
        options: ["a network of cells that fights harmful germs", "a kind of bone", "a part of the blood only", "a type of vaccine"]
        correct_index: 0
      - prompt: "How does a vaccine help the body?"
        type: mc
        options: ["it lets the body learn to defeat a germ in advance", "it removes all germs", "it makes the body sleep", "it cools the blood"]
        correct_index: 0
      - prompt: "Explain why a vaccine is described as 'a clever shortcut'."
        type: written
    vocabulary:
      - word: "immune"
        definition: "protected against a disease"
        context_sentence: "This is your immune system."
      - word: "recognise"
        definition: "to know something because it has been met before"
        context_sentence: "The body must learn to recognise it."
      - word: "vaccine"
        definition: "a medicine that helps the body fight a disease"
        context_sentence: "A vaccine shows the immune system a harmless piece of a germ."

  - title: "A River of Plastic"
    reading_level: 6
    body: >
      Every year, millions of tonnes of plastic end up in the sea. Unlike leaves or
      wood, plastic does not rot away; it lingers for hundreds of years, breaking
      into ever smaller pieces. Sea turtles mistake floating bags for jellyfish and
      swallow them; seabirds feed bright fragments to their chicks. The problem can
      feel overwhelming, but it begins with small, everyday choices. Refusing a
      single-use bag, choosing a reusable bottle, and disposing of rubbish properly
      all help. The ocean's health depends not on a few grand gestures, but on
      millions of ordinary people caring enough to change.
    questions:
      - prompt: "Why is plastic in the sea such a lasting problem?"
        type: mc
        options: ["it does not rot and lingers for hundreds of years", "it sinks at once", "fish eat it safely", "it turns into food"]
        correct_index: 0
      - prompt: "According to the passage, where does the solution begin?"
        type: mc
        options: ["with small, everyday choices", "with the government alone", "with scientists only", "with the sea itself"]
        correct_index: 0
      - prompt: "Explain the idea that the ocean's health depends on 'millions of ordinary people'."
        type: written
    vocabulary:
      - word: "lingers"
        definition: "stays for a long time"
        context_sentence: "Plastic lingers for hundreds of years."
      - word: "overwhelming"
        definition: "very great; too much to deal with"
        context_sentence: "The problem can feel overwhelming."
      - word: "reusable"
        definition: "able to be used again"
        context_sentence: "Choosing a reusable bottle helps."

  - title: "The Habit of Saving"
    reading_level: 6
    body: >
      When Jamal received a little money each week, it burned a hole in his pocket;
      it was gone by the weekend. His grandfather taught him a simple rule: pay
      yourself first. Before spending anything, Jamal put a small part into a jar he
      could not easily open. At first the coins added up slowly, and the waiting was
      hard. But month by month the jar grew heavier. When his old bicycle broke,
      Jamal had the savings to repair it without asking anyone. He learned that
      wealth is built not by great sums, but by the patient habit of setting a
      little aside.
    questions:
      - prompt: "What simple rule did Jamal's grandfather teach him?"
        type: mc
        options: ["pay yourself first", "spend it all quickly", "never earn money", "borrow when needed"]
        correct_index: 0
      - prompt: "How was Jamal able to repair his bicycle?"
        type: mc
        options: ["he had savings put aside", "he sold the jar", "his grandfather paid", "he found money"]
        correct_index: 0
      - prompt: "Explain the lesson that 'wealth is built by the patient habit of setting a little aside'."
        type: written
    vocabulary:
      - word: "wealth"
        definition: "a large amount of money or valuable things"
        context_sentence: "Wealth is built by patient habits."
      - word: "patient"
        definition: "able to wait calmly without hurrying"
        context_sentence: "The patient habit of setting a little aside."
      - word: "savings"
        definition: "money kept for future use"
        context_sentence: "Jamal had the savings to repair it."

  - title: "The Vanishing Pawi"
    reading_level: 6
    body: >
      High in the forested hills of Trinidad lives the pawi, a large black bird
      found nowhere else on earth. Sadly, it is one of the world's most endangered
      birds. Hunting and the clearing of its mountain forest have driven its numbers
      dangerously low. Because the pawi exists only here, if it disappears from
      Trinidad, it disappears from the whole planet forever. Scientists and villagers
      now work together to protect the last patches of its habitat and to persuade
      hunters to leave it in peace. Saving the pawi is a duty that belongs to us
      alone, for no other nation can do it.
    questions:
      - prompt: "Why is the pawi found 'nowhere else on earth' important?"
        type: mc
        options: ["if it vanishes here, it is gone from the whole planet", "it is the largest bird", "it can be found abroad", "it cannot fly"]
        correct_index: 0
      - prompt: "What has driven the pawi's numbers dangerously low?"
        type: mc
        options: ["hunting and clearing of its forest", "too much rain", "other birds", "cold weather"]
        correct_index: 0
      - prompt: "Explain why the writer says saving the pawi 'belongs to us alone'."
        type: written
    vocabulary:
      - word: "endangered"
        definition: "at serious risk of dying out"
        context_sentence: "It is one of the most endangered birds."
      - word: "habitat"
        definition: "the natural home of an animal"
        context_sentence: "They protect the last patches of its habitat."
      - word: "persuade"
        definition: "to make someone agree by giving reasons"
        context_sentence: "To persuade hunters to leave it in peace."

  - title: "The Art of Listening"
    reading_level: 6
    body: >
      Everyone speaks, but few truly listen. To listen well is more than staying
      silent while another talks; it is giving your whole attention, watching their
      face, and trying to understand the feeling behind their words. Too often we
      are only waiting for our turn to speak, already forming a reply. A good
      listener makes the speaker feel valued and understood, and often learns things
      a talker never could. In arguments, careful listening can cool anger faster
      than any clever answer. Of all the skills we can develop, the humble art of
      listening may be among the most powerful.
    questions:
      - prompt: "What is true listening, according to the passage?"
        type: mc
        options: ["giving whole attention and understanding the feeling behind the words", "staying silent only", "nodding politely", "repeating what is said"]
        correct_index: 0
      - prompt: "What can careful listening do in an argument?"
        type: mc
        options: ["cool anger faster than a clever answer", "win the argument by force", "end the conversation", "prove who is right"]
        correct_index: 0
      - prompt: "Explain why the writer calls listening a 'humble' but 'powerful' art."
        type: written
    vocabulary:
      - word: "attention"
        definition: "careful thought and notice given to something"
        context_sentence: "Listening is giving your whole attention."
      - word: "valued"
        definition: "treated as important"
        context_sentence: "A good listener makes the speaker feel valued."
      - word: "develop"
        definition: "to grow or improve over time"
        context_sentence: "Of all the skills we can develop."

  - title: "The Meaning of Freedom"
    reading_level: 6
    body: >
      We often think of freedom simply as being able to do whatever we want. Yet
      true freedom is more thoughtful than that. A river is most free not when it
      overflows in every direction, but when it flows powerfully within its banks.
      In the same way, a person becomes truly free through self-control, education,
      and respect for others. A society is free not when there are no rules, but
      when its rules are fair and protect everyone equally. Real freedom, then, is
      not the absence of all limits, but the presence of the right ones.
    questions:
      - prompt: "How does the passage say a person becomes 'truly free'?"
        type: mc
        options: ["through self-control, education, and respect for others", "by breaking all rules", "by having lots of money", "by living alone"]
        correct_index: 0
      - prompt: "When is a society free, according to the writer?"
        type: mc
        options: ["when its rules are fair and protect everyone equally", "when there are no rules", "when the strongest decide", "when it is silent"]
        correct_index: 0
      - prompt: "Explain the comparison of freedom to 'a river that flows powerfully within its banks'."
        type: written
    vocabulary:
      - word: "overflows"
        definition: "spills over the edges"
        context_sentence: "Not when it overflows in every direction."
      - word: "self-control"
        definition: "the ability to control one's own actions"
        context_sentence: "A person becomes free through self-control."
      - word: "presence"
        definition: "the state of being there; existence of something"
        context_sentence: "Freedom is the presence of the right limits."

  - title: "The Great Migration of the Monarch"
    reading_level: 6
    body: >
      The monarch butterfly weighs less than a paperclip, yet it makes one of the
      most astonishing journeys in nature. Each year, monarchs travel thousands of
      kilometres to reach the same forests where their ancestors wintered. What
      makes this so remarkable is that no single butterfly lives to make the whole
      round trip. The journey spans several short generations; the great-grandchild
      of the butterfly that set out completes the return. Somehow, without ever
      having seen the destination, each new generation knows the way. It is a mystery
      that continues to amaze the scientists who study it.
    questions:
      - prompt: "What is remarkable about which butterfly completes the round trip?"
        type: mc
        options: ["no single butterfly lives to make the whole trip", "only the oldest one does", "they all live for years", "one leader guides them"]
        correct_index: 0
      - prompt: "How does each new generation know the way?"
        type: mc
        options: ["it is a mystery scientists cannot fully explain", "an older butterfly teaches them", "they follow a map", "they follow ships"]
        correct_index: 0
      - prompt: "Explain why the monarch's migration is called 'one of the most astonishing journeys in nature'."
        type: written
    vocabulary:
      - word: "astonishing"
        definition: "very surprising and impressive"
        context_sentence: "It makes one of the most astonishing journeys."
      - word: "generations"
        definition: "groups of living things born and living about the same time"
        context_sentence: "The journey spans several short generations."
      - word: "destination"
        definition: "the place a journey is heading to"
        context_sentence: "Without ever having seen the destination."

  - title: "The Weight of Words"
    reading_level: 6
    body: >
      A careless word can wound as deeply as a blow, and a kind word can heal what
      medicine cannot reach. We sometimes forget that once spoken, words cannot be
      called back, like feathers scattered to the wind. A cruel joke may be
      forgotten by the one who tells it, yet remembered for years by the one it hurt.
      Just as surely, a word of encouragement can lift a struggling person and change
      the course of their day, or even their life. Because words carry such weight,
      it is wise to weigh them carefully before we let them fly.
    questions:
      - prompt: "What comparison does the writer use for spoken words that cannot be taken back?"
        type: mc
        options: ["feathers scattered to the wind", "stones in a wall", "coins in a jar", "seeds in soil"]
        correct_index: 0
      - prompt: "What can a word of encouragement do?"
        type: mc
        options: ["lift a struggling person and change their day", "cost a lot of money", "cause an argument", "be easily forgotten"]
        correct_index: 0
      - prompt: "Explain why the writer advises us to 'weigh our words carefully before we let them fly'."
        type: written
    vocabulary:
      - word: "careless"
        definition: "not giving enough attention or thought"
        context_sentence: "A careless word can wound deeply."
      - word: "encouragement"
        definition: "words that give someone hope or confidence"
        context_sentence: "A word of encouragement can lift a person."
      - word: "weigh"
        definition: "to think carefully about"
        context_sentence: "It is wise to weigh our words."

  - title: "The Mystery of Dreams"
    reading_level: 6
    body: >
      Every night, as we sleep, our minds create strange and vivid stories we call
      dreams. Even now, scientists do not fully understand why we dream. Some
      believe dreams help the brain sort through the day's memories, keeping what
      matters and discarding the rest. Others think dreaming lets us safely rehearse
      dangers or work through worries. Dreams can be joyful, frightening, or utterly
      nonsensical, and most are forgotten within moments of waking. Whatever their
      true purpose, dreams reveal that even in sleep, the human mind is a restless
      and wondrous place, forever busy in the dark.
    questions:
      - prompt: "What is one thing scientists believe dreams may do?"
        type: mc
        options: ["help the brain sort through the day's memories", "cool the body", "make us taller", "stop the heart"]
        correct_index: 0
      - prompt: "What happens to most dreams after we wake?"
        type: mc
        options: ["they are forgotten within moments", "they come true", "they are written down", "they repeat"]
        correct_index: 0
      - prompt: "Explain what the writer means by the mind being 'a restless and wondrous place, forever busy in the dark'."
        type: written
    vocabulary:
      - word: "vivid"
        definition: "very clear and lifelike"
        context_sentence: "Our minds create strange and vivid stories."
      - word: "discarding"
        definition: "throwing away what is not wanted"
        context_sentence: "Keeping what matters and discarding the rest."
      - word: "rehearse"
        definition: "to practise something beforehand"
        context_sentence: "Dreaming lets us safely rehearse dangers."

  - title: "The Spider's Silk"
    reading_level: 6
    body: >
      For its weight, spider silk is one of the strongest materials on Earth,
      stronger even than steel of the same thickness, yet so fine that a strand is
      almost invisible. A spider spins several different kinds of silk from tiny
      spinnerets: some sticky to trap prey, some dry and tough to anchor the web.
      Scientists have long dreamed of copying this remarkable thread to make
      lightweight ropes, medical stitches, and even body armour. So far, no factory
      has matched what a small creature produces effortlessly each night. The humble
      spider, it seems, is an engineer whose skill we are only beginning to
      understand.
    questions:
      - prompt: "Why is spider silk considered remarkable?"
        type: mc
        options: ["it is stronger than steel for its weight", "it glows in the dark", "it never breaks", "it is made of metal"]
        correct_index: 0
      - prompt: "What is one use scientists hope to copy silk for?"
        type: mc
        options: ["medical stitches and body armour", "cooking food", "painting walls", "cooling houses"]
        correct_index: 0
      - prompt: "Explain what the writer means by calling the spider 'an engineer whose skill we are only beginning to understand'."
        type: written
    vocabulary:
      - word: "spinnerets"
        definition: "the organs a spider uses to produce silk"
        context_sentence: "A spider spins silk from tiny spinnerets."
      - word: "anchor"
        definition: "to hold something firmly in place"
        context_sentence: "Some silk is dry and tough to anchor the web."
      - word: "effortlessly"
        definition: "done easily, without strain"
        context_sentence: "What a small creature produces effortlessly each night."

  - title: "The Currents of the Ocean"
    reading_level: 7
    body: >
      Beneath the restless surface of the sea, vast rivers of water circle the globe,
      driven by wind, heat, and the spin of the Earth itself. These ocean currents
      carry warmth from the tropics toward the poles, tempering climates on distant
      shores; without them, much of Europe would lie frozen. They ferry nutrients
      that feed great blooms of life, and they scatter the eggs of creatures across
      thousands of miles. Yet as the planet warms, these ancient currents may falter,
      and scientists warn that even a slight slowing could reshape weather across
      whole continents. The ocean, it turns out, is not a barrier between nations but
      a shared and delicate machine.
    questions:
      - prompt: "What drives the ocean's great currents?"
        type: mc
        options: ["wind, heat, and the Earth's spin", "the moon alone", "passing ships", "underwater volcanoes only"]
        correct_index: 0
      - prompt: "Why does the writer say Europe would be frozen without currents?"
        type: mc
        options: ["currents carry warmth toward the poles", "currents block the sun", "currents make rain", "currents cool the tropics"]
        correct_index: 0
      - prompt: "Explain what the writer means by calling the ocean 'a shared and delicate machine'."
        type: written
    vocabulary:
      - word: "tempering"
        definition: "making something less extreme or more moderate"
        context_sentence: "Tempering climates on distant shores."
      - word: "nutrients"
        definition: "substances that living things need to grow"
        context_sentence: "They ferry nutrients that feed great blooms of life."
      - word: "falter"
        definition: "to weaken or begin to fail"
        context_sentence: "These ancient currents may falter."

  - title: "The Long Road to Emancipation"
    reading_level: 7
    body: >
      Freedom, for the enslaved people of the Caribbean, was not simply given; it was
      won through generations of resistance, courage, and unbreakable hope. Though the
      law finally abolished slavery in 1834, true liberty came slowly, for the freed
      people still faced poverty, prejudice, and years of forced apprenticeship. Yet
      they built villages, founded churches and schools, and passed down a fierce
      belief that no person should ever own another. Emancipation Day is therefore not
      only a celebration but a solemn remembrance of those who endured the
      unendurable. To understand freedom fully, we must remember how dearly it was
      purchased.
    questions:
      - prompt: "In what year was slavery abolished, according to the passage?"
        type: mc
        options: ["1834", "1900", "1776", "1950"]
        correct_index: 0
      - prompt: "What did the freed people build after emancipation?"
        type: mc
        options: ["villages, churches, and schools", "factories and railways", "castles", "ships"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'we must remember how dearly it was purchased'."
        type: written
    vocabulary:
      - word: "abolished"
        definition: "officially ended or done away with"
        context_sentence: "The law finally abolished slavery."
      - word: "apprenticeship"
        definition: "a period of required labour or training"
        context_sentence: "Years of forced apprenticeship."
      - word: "solemn"
        definition: "serious and dignified"
        context_sentence: "A solemn remembrance of those who endured."

  - title: "The Memory of Trees"
    reading_level: 7
    body: >
      A tree carries its whole history within it. Each year it lays down a fresh ring
      of wood, wide in seasons of plenty and narrow in years of drought, so that a
      single stump can tell a story stretching back centuries. Scientists read these
      rings the way a historian reads an old manuscript, tracing ancient fires,
      floods, and shifts in climate long before any human wrote them down. Some trees
      alive today were already old when great empires rose and fell. To stand before
      such a tree is to stand before a living record, patient and silent, that has
      quietly outlasted the noise of human ambition.
    questions:
      - prompt: "What makes a tree's rings wide or narrow?"
        type: mc
        options: ["plentiful or dry seasons", "the colour of its leaves", "the height of the tree", "the animals nearby"]
        correct_index: 0
      - prompt: "How do scientists use tree rings?"
        type: mc
        options: ["to trace ancient fires, floods, and climate", "to measure the wind", "to count the leaves", "to find gold"]
        correct_index: 0
      - prompt: "Explain what the writer means by calling a tree 'a living record'."
        type: written
    vocabulary:
      - word: "drought"
        definition: "a long period with little or no rain"
        context_sentence: "Narrow in years of drought."
      - word: "manuscript"
        definition: "an old handwritten document"
        context_sentence: "The way a historian reads an old manuscript."
      - word: "outlasted"
        definition: "lived or lasted longer than something else"
        context_sentence: "Quietly outlasted the noise of human ambition."

  - title: "The Unseen Force"
    reading_level: 7
    body: >
      Gravity is the quietest ruler of the universe, yet nothing escapes its reach. It
      holds our feet to the ground, keeps the moon circling the Earth, and binds
      billions of stars into the slow, wheeling shape of a galaxy. Though we never see
      it, we feel its pull in every step and every fall. For centuries people simply
      accepted that objects dropped downward, until curious minds began to ask why.
      Their questions revealed that the same force pulling an apple to the earth also
      governs the paths of distant planets. It is a humbling thought: one invisible
      rule, written into everything, connects the smallest pebble to the greatest star.
    questions:
      - prompt: "What does gravity do to the moon?"
        type: mc
        options: ["keeps it circling the Earth", "makes it glow", "pushes it away", "changes its colour"]
        correct_index: 0
      - prompt: "What did curious minds begin to ask?"
        type: mc
        options: ["why objects fall downward", "how to fly", "where stars go", "why the sky is blue"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'one invisible rule connects the smallest pebble to the greatest star'."
        type: written
    vocabulary:
      - word: "binds"
        definition: "holds tightly together"
        context_sentence: "Binds billions of stars into a galaxy."
      - word: "governs"
        definition: "controls or directs"
        context_sentence: "The same force governs the paths of planets."
      - word: "humbling"
        definition: "making one feel modest or small"
        context_sentence: "It is a humbling thought."

  - title: "The Fragile Balance"
    reading_level: 7
    body: >
      In nature, every living thing is bound to countless others in a web so intricate
      that the loss of one thread can unravel the whole. Remove the top predator from
      a forest, and the deer multiply, the young trees are eaten, and the soil itself
      begins to wash away. Restore that predator, and slowly the forest heals. Such
      chains of cause and effect remind us that no creature, however small or fierce,
      stands alone. When people treat a single species as worthless, they often fail
      to see the hidden work it performs. Wisdom, in dealing with the natural world,
      begins with humility about how little we truly understand.
    questions:
      - prompt: "What happens when the top predator is removed?"
        type: mc
        options: ["deer multiply and young trees are eaten", "the forest grows faster", "rivers dry up", "birds leave"]
        correct_index: 0
      - prompt: "What does the writer say wisdom about nature begins with?"
        type: mc
        options: ["humility about how little we understand", "cutting down forests", "counting animals", "building fences"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'the loss of one thread can unravel the whole'."
        type: written
    vocabulary:
      - word: "intricate"
        definition: "very detailed and complicated"
        context_sentence: "A web so intricate."
      - word: "predator"
        definition: "an animal that hunts others for food"
        context_sentence: "Remove the top predator from a forest."
      - word: "humility"
        definition: "a modest view of one's own importance"
        context_sentence: "Wisdom begins with humility."

  - title: "The Courage to Question"
    reading_level: 7
    body: >
      Progress has always depended on those brave enough to doubt what everyone else
      accepts. When the whole world believed the sun circled the Earth, a few patient
      observers dared to suggest otherwise, and endured ridicule for it. To question
      is not to be disrespectful; it is to take an idea seriously enough to test it.
      A mind that accepts every claim without examination is as poorly served as one
      that rejects everything out of stubbornness. True learning lives in the balance:
      open enough to consider, careful enough to demand evidence. The student who asks
      "how do we know?" has already begun the most important work of the mind.
    questions:
      - prompt: "What did patient observers dare to suggest?"
        type: mc
        options: ["that the Earth circled the sun", "that the sky was solid", "that the sea had no bottom", "that stars were fires"]
        correct_index: 0
      - prompt: "According to the writer, to question an idea is to do what?"
        type: mc
        options: ["take it seriously enough to test it", "insult the speaker", "ignore it", "accept it blindly"]
        correct_index: 0
      - prompt: "Explain what the writer means by asking 'how do we know?' being the most important work of the mind."
        type: written
    vocabulary:
      - word: "ridicule"
        definition: "unkind mockery or laughter aimed at someone"
        context_sentence: "They endured ridicule for it."
      - word: "examination"
        definition: "careful and detailed inspection"
        context_sentence: "Accepts every claim without examination."
      - word: "evidence"
        definition: "facts that show whether something is true"
        context_sentence: "Careful enough to demand evidence."

  - title: "The Roots of Language"
    reading_level: 7
    body: >
      Every language spoken today grew, over countless generations, from older tongues
      now long silent. Words travel and change like rivers, borrowing from neighbours,
      shedding old sounds, and inventing new ones to name a changing world. The
      English we speak is a patchwork stitched from many peoples, and the Creole of the
      Caribbean carries within it the voices of Africa, Europe, and India woven
      together. Far from being careless or broken, such languages are living proof of
      human ingenuity, shaped by history itself. To lose a language is to lose a way of
      seeing; to cherish one is to keep an entire people's memory alive.
    questions:
      - prompt: "How does the writer say words change?"
        type: mc
        options: ["they travel and change like rivers", "they never change", "they are fixed by law", "they shrink each year"]
        correct_index: 0
      - prompt: "What voices does Caribbean Creole carry, according to the passage?"
        type: mc
        options: ["Africa, Europe, and India", "only Europe", "only Africa", "none at all"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'to lose a language is to lose a way of seeing'."
        type: written
    vocabulary:
      - word: "tongues"
        definition: "languages"
        context_sentence: "Grew from older tongues now long silent."
      - word: "patchwork"
        definition: "something made of many different pieces joined together"
        context_sentence: "English is a patchwork stitched from many peoples."
      - word: "ingenuity"
        definition: "cleverness and inventiveness"
        context_sentence: "Living proof of human ingenuity."

  - title: "The Machinery of Weather"
    reading_level: 7
    body: >
      A thunderstorm may seem like chaos, but it is the visible working of an enormous,
      orderly machine. The sun heats the land, warm air rises and cools, moisture
      gathers into towering clouds, and within them charges build until lightning
      leaps to balance them. Every drop of rain, every gust of wind, obeys laws that
      scientists can measure and, increasingly, predict. This understanding is no idle
      curiosity: an accurate forecast can send fishermen safely to harbour and warn a
      village before a flood arrives. The more clearly we read the sky's machinery, the
      better we can live with a power far greater than ourselves.
    questions:
      - prompt: "What causes lightning, according to the passage?"
        type: mc
        options: ["charges build until they must balance", "birds flying", "the moon rising", "cold water"]
        correct_index: 0
      - prompt: "Why does the writer say weather understanding is not 'idle curiosity'?"
        type: mc
        options: ["forecasts can keep people safe", "it makes storms stop", "it controls the sun", "it is only for fun"]
        correct_index: 0
      - prompt: "Explain what the writer means by calling a storm 'the visible working of an orderly machine'."
        type: written
    vocabulary:
      - word: "moisture"
        definition: "tiny drops of water in the air"
        context_sentence: "Moisture gathers into towering clouds."
      - word: "charges"
        definition: "amounts of electricity"
        context_sentence: "Charges build until lightning leaps."
      - word: "forecast"
        definition: "a prediction of future weather"
        context_sentence: "An accurate forecast can send fishermen to harbour."

  - title: "The Discipline of Practice"
    reading_level: 7
    body: >
      We admire the pianist whose fingers fly and the athlete whose body seems to obey
      without effort, and we call it talent. But behind that ease lie thousands of
      unseen hours of patient, often tedious repetition. Skill is not a gift that
      arrives whole; it is built slowly, one corrected mistake at a time, long after
      the excitement of a new pursuit has faded. Those who succeed are rarely the most
      gifted at the start, but those who kept returning when the work grew dull. The
      true secret, if there is one, is simply this: to practise deliberately, and to
      refuse to quit.
    questions:
      - prompt: "What lies behind an athlete's apparent ease?"
        type: mc
        options: ["thousands of unseen hours of repetition", "pure luck", "expensive equipment", "a single lesson"]
        correct_index: 0
      - prompt: "Who does the writer say usually succeeds?"
        type: mc
        options: ["those who keep returning when work grows dull", "the most gifted beginners", "the youngest players", "the wealthiest"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'skill is built one corrected mistake at a time'."
        type: written
    vocabulary:
      - word: "tedious"
        definition: "boring because it goes on a long time"
        context_sentence: "Patient, often tedious repetition."
      - word: "deliberately"
        definition: "carefully and on purpose"
        context_sentence: "To practise deliberately."
      - word: "pursuit"
        definition: "an activity someone works at"
        context_sentence: "The excitement of a new pursuit."

  - title: "The Vanishing Glaciers"
    reading_level: 7
    body: >
      High in the mountains and across the frozen poles lie great sheets of ancient
      ice, formed from snows that fell before history began. For thousands of years
      they held their shape, feeding rivers each summer as they slowly melted and
      renewing themselves each winter as fresh snow arrived. Now that balance is
      breaking. As the world grows warmer, the ice retreats faster than the snow can
      replace it, and glaciers that fed whole civilisations are shrinking within a
      single lifetime. Their loss will raise the seas and rob distant valleys of their
      water. The quiet melting of a far-off glacier, it turns out, can reach the
      doorstep of us all.
    questions:
      - prompt: "How did glaciers stay in balance for thousands of years?"
        type: mc
        options: ["fresh snow replaced what melted", "they never melted", "rain refilled them", "people rebuilt them"]
        correct_index: 0
      - prompt: "What two effects of melting glaciers does the writer name?"
        type: mc
        options: ["rising seas and lost water supplies", "louder storms and colder winters", "more fish and more trees", "brighter skies"]
        correct_index: 0
      - prompt: "Explain what the writer means by a far-off glacier reaching 'the doorstep of us all'."
        type: written
    vocabulary:
      - word: "glaciers"
        definition: "great slow-moving masses of ice"
        context_sentence: "Glaciers that fed whole civilisations."
      - word: "retreats"
        definition: "moves back or shrinks away"
        context_sentence: "The ice retreats faster than the snow can replace it."
      - word: "renewing"
        definition: "making fresh or whole again"
        context_sentence: "Renewing themselves each winter."

  - title: "The Art of Persuasion"
    reading_level: 7
    body: >
      To persuade is one of the oldest and most powerful of human skills, and like any
      power it can be used well or badly. A skilful speaker appeals to reason with
      evidence, to emotion with vivid images, and to trust by seeming honest and fair.
      The same tools that rally a nation to justice can also mislead a crowd toward
      folly, and the words sound equally fine in both mouths. That is why a careful
      listener learns to ask not only "how does this make me feel?" but "is it
      actually true?" To be moved by words is human; to weigh them before being moved
      is wisdom.
    questions:
      - prompt: "What three things does a skilful speaker appeal to?"
        type: mc
        options: ["reason, emotion, and trust", "money, fame, and power", "fear, hunger, and sleep", "colour, sound, and light"]
        correct_index: 0
      - prompt: "What question does a careful listener also ask?"
        type: mc
        options: ["is it actually true?", "who is speaking loudest?", "how long will it take?", "where are we?"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'to weigh words before being moved is wisdom'."
        type: written
    vocabulary:
      - word: "persuade"
        definition: "to convince someone to believe or do something"
        context_sentence: "To persuade is one of the oldest human skills."
      - word: "folly"
        definition: "foolishness or a foolish act"
        context_sentence: "Mislead a crowd toward folly."
      - word: "rally"
        definition: "to gather people together for a cause"
        context_sentence: "Rally a nation to justice."

  - title: "The Chemistry of Cooking"
    reading_level: 7
    body: >
      A kitchen is a quiet laboratory where transformations happen every day. When
      dough meets heat, trapped bubbles of gas expand and the loaf rises; when sugar
      is warmed, it darkens and takes on a deep, toasted flavour it never had before.
      These are not tricks but chemistry, the same science studied in gleaming
      laboratories, unfolding in ordinary pots and pans. The cook who understands why
      a sauce thickens or why meat browns can correct a dish instead of merely hoping.
      Far from being separate worlds, science and everyday life are woven together, and
      the humble act of preparing a meal is proof of it.
    questions:
      - prompt: "Why does a loaf rise in the oven?"
        type: mc
        options: ["trapped gas bubbles expand", "the flour turns to water", "it absorbs light", "the salt melts"]
        correct_index: 0
      - prompt: "What advantage does an understanding cook have?"
        type: mc
        options: ["they can correct a dish, not just hope", "they cook faster only", "they need no recipes", "they use less fire"]
        correct_index: 0
      - prompt: "Explain what the writer means by calling a kitchen 'a quiet laboratory'."
        type: written
    vocabulary:
      - word: "transformations"
        definition: "complete changes in form or nature"
        context_sentence: "Transformations happen every day."
      - word: "expand"
        definition: "to grow larger in size"
        context_sentence: "Bubbles of gas expand and the loaf rises."
      - word: "gleaming"
        definition: "shining brightly"
        context_sentence: "The same science studied in gleaming laboratories."

  - title: "The Ripple Effect"
    reading_level: 7
    body: >
      A single act of kindness rarely stops with the person who receives it. The child
      helped across a busy road grows up to help another; the stranger who is shown
      patience passes that patience on, often without ever knowing where it began. In
      this way, one small deed can travel outward through a community like ripples
      across a pond, touching lives the giver will never meet. The same is true, sadly,
      of cruelty, which hardens hearts and spreads in its own dark way. Since we cannot
      always choose what happens to us, the truest measure of a person may be which of
      these ripples they choose to send out.
    questions:
      - prompt: "How does the writer describe an act of kindness spreading?"
        type: mc
        options: ["like ripples across a pond", "like a falling stone", "like a closing door", "like a sudden storm"]
        correct_index: 0
      - prompt: "What does the writer say is also true of cruelty?"
        type: mc
        options: ["it hardens hearts and spreads", "it disappears at once", "it helps no one but harms no one", "it cannot travel"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'the truest measure of a person is which ripples they send out'."
        type: written
    vocabulary:
      - word: "ripples"
        definition: "small waves spreading across water"
        context_sentence: "Like ripples across a pond."
      - word: "community"
        definition: "a group of people living or working together"
        context_sentence: "Travel outward through a community."
      - word: "measure"
        definition: "a way of judging the size or worth of something"
        context_sentence: "The truest measure of a person."

  - title: "The Threads of Trade"
    reading_level: 7
    body: >
      The shirt on your back and the phone in your hand have travelled further than
      most people ever will. Cotton grown in one land may be spun in another, sewn in a
      third, and sold in a fourth, its journey stitched from the labour of strangers
      across the globe. This vast network of trade can lift whole nations out of
      poverty, yet it can also hide injustice, when those who make our goods are paid
      too little to share in their worth. To be a thoughtful buyer is to remember the
      unseen hands behind each object, and to ask whether the bargain was fair to
      everyone who touched it.
    questions:
      - prompt: "What journey does the writer describe a shirt taking?"
        type: mc
        options: ["grown, spun, sewn, and sold in different lands", "made entirely in one town", "found already finished", "printed by a machine"]
        correct_index: 0
      - prompt: "What injustice can trade hide?"
        type: mc
        options: ["makers paid too little to share the worth", "goods that are too cheap to sell", "shops that stay empty", "ships that never sail"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'the unseen hands behind each object'."
        type: written
    vocabulary:
      - word: "network"
        definition: "a large connected system"
        context_sentence: "This vast network of trade."
      - word: "injustice"
        definition: "unfair treatment"
        context_sentence: "It can also hide injustice."
      - word: "bargain"
        definition: "an agreement, especially about price"
        context_sentence: "Whether the bargain was fair."

  - title: "The Digital Footprint"
    reading_level: 7
    body: >
      Every message we send and every photograph we share leaves a mark that does not
      fade as easily as we imagine. Long after a moment has passed, its record may
      remain, copied and stored on machines far beyond our reach. This lasting trail,
      our digital footprint, can open doors, showing the world our talents and our
      kindness, but it can also follow us in ways we never intended. The wise course
      is not fear but care: to pause before we post, to remember that the internet
      rarely forgets, and to build a trail we will not one day wish to erase. What we
      share today speaks for us tomorrow.
    questions:
      - prompt: "Why does a digital footprint last?"
        type: mc
        options: ["records are copied and stored on distant machines", "the internet deletes everything nightly", "photographs fade slowly", "no one keeps records"]
        correct_index: 0
      - prompt: "What wise course does the writer recommend?"
        type: mc
        options: ["to pause before we post", "to never use the internet", "to post as much as possible", "to fear all technology"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'what we share today speaks for us tomorrow'."
        type: written
    vocabulary:
      - word: "record"
        definition: "a stored account of something"
        context_sentence: "Its record may remain."
      - word: "trail"
        definition: "a series of marks left behind"
        context_sentence: "This lasting trail, our digital footprint."
      - word: "intended"
        definition: "meant or planned"
        context_sentence: "In ways we never intended."

  - title: "The Pull of the Tides"
    reading_level: 7
    body: >
      Twice each day the sea climbs the shore and twice it falls away, a rhythm so
      steady that fishermen set their lives by it. This great breathing of the ocean is
      no accident: it is the moon, and to a lesser degree the sun, tugging gently at
      the water as they pass overhead. When both line up, the tides swell higher than
      usual; when they pull against each other, the tides grow mild. For those who
      gather from the shore, misreading this rhythm can be dangerous, for a rising tide
      can trap the careless on a vanishing sandbank. The heavens, in this quiet way,
      shape the daily labour of people who may never think of them.
    questions:
      - prompt: "What mainly causes the tides?"
        type: mc
        options: ["the moon tugging at the water", "the wind alone", "passing ships", "warm currents"]
        correct_index: 0
      - prompt: "When do tides swell highest?"
        type: mc
        options: ["when the sun and moon line up", "when clouds gather", "at midnight only", "in winter only"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'the heavens shape the daily labour of people'."
        type: written
    vocabulary:
      - word: "rhythm"
        definition: "a regular repeated pattern"
        context_sentence: "A rhythm so steady."
      - word: "swell"
        definition: "to grow larger or rise"
        context_sentence: "The tides swell higher than usual."
      - word: "sandbank"
        definition: "a raised ridge of sand near the shore"
        context_sentence: "A rising tide can trap the careless on a vanishing sandbank."

  - title: "The Genius of the Brain"
    reading_level: 7
    body: >
      Weighing little more than a large mango, the human brain is the most complex
      object we have ever discovered. Within it, billions of tiny cells pass signals
      along a web of connections greater in number than the stars of our galaxy. This
      soft grey tissue lets you read these very words, recall a distant birthday, feel
      wonder, and imagine a future that does not yet exist. Even so, much of how it
      works remains a mystery, and the mind studying the brain is, remarkably, the
      brain studying itself. To care for it, through rest, curiosity, and learning, is
      to tend the most extraordinary instrument any of us will ever own.
    questions:
      - prompt: "What does the writer compare the number of brain connections to?"
        type: mc
        options: ["the stars of our galaxy", "grains of sand on a beach", "drops in the sea", "leaves on a tree"]
        correct_index: 0
      - prompt: "What remarkable idea does the writer point out?"
        type: mc
        options: ["the brain studies itself", "the brain never rests", "the brain is the largest organ", "the brain feels no pain"]
        correct_index: 0
      - prompt: "Explain what the writer means by calling the brain 'the most extraordinary instrument any of us will ever own'."
        type: written
    vocabulary:
      - word: "complex"
        definition: "made of many connected parts; complicated"
        context_sentence: "The most complex object we have ever discovered."
      - word: "signals"
        definition: "messages passed from one place to another"
        context_sentence: "Billions of tiny cells pass signals."
      - word: "tissue"
        definition: "the material that living bodies are made of"
        context_sentence: "This soft grey tissue lets you read."

  - title: "The Story of Numbers"
    reading_level: 7
    body: >
      Numbers seem so ordinary that we forget they were once a great invention. Early
      peoples counted with notches on bone and pebbles in a pouch, but as trade and
      building grew, they needed something more. Different civilisations invented
      different symbols, and one idea, the humble zero, was so difficult to grasp that
      it arrived late and changed everything, for it let us write vast numbers with
      ease. Today the same handful of digits carries rockets to distant planets and
      keeps track of a shopkeeper's change. Behind every calculation lies thousands of
      years of human thought, quietly passed from one generation to the next.
    questions:
      - prompt: "How did early peoples count?"
        type: mc
        options: ["with notches on bone and pebbles", "with computers", "with printed books", "with clocks"]
        correct_index: 0
      - prompt: "Why was the zero important?"
        type: mc
        options: ["it let people write vast numbers with ease", "it made counting slower", "it replaced all letters", "it stopped trade"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'behind every calculation lies thousands of years of human thought'."
        type: written
    vocabulary:
      - word: "notches"
        definition: "small cuts made as marks"
        context_sentence: "Notches on bone."
      - word: "civilisations"
        definition: "advanced and organised human societies"
        context_sentence: "Different civilisations invented different symbols."
      - word: "digits"
        definition: "the single figures from 0 to 9"
        context_sentence: "The same handful of digits."

  - title: "The Colours of Light"
    reading_level: 7
    body: >
      The light that seems plain and white is, in truth, a hidden crowd of colours
      travelling together. When sunlight passes through a raindrop, it bends and
      separates, and for a moment the sky reveals its secret in a rainbow's arch.
      Colour, then, is not something objects possess but something they do: a leaf
      appears green because it drinks in every colour except green, which it throws
      back to our eyes. Understanding this changed how people saw the world and led to
      inventions from cameras to healing lasers. There is a lesson in it, too, that
      what looks simple is often woven from many things we have not yet learned to see.
    questions:
      - prompt: "What happens when sunlight passes through a raindrop?"
        type: mc
        options: ["it bends and separates into colours", "it turns to heat", "it disappears", "it becomes sound"]
        correct_index: 0
      - prompt: "Why does a leaf appear green?"
        type: mc
        options: ["it throws back green and drinks the rest", "it is painted green", "it makes its own light", "it reflects all colours"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'what looks simple is often woven from many things'."
        type: written
    vocabulary:
      - word: "separates"
        definition: "divides into parts"
        context_sentence: "It bends and separates."
      - word: "reveals"
        definition: "makes known or shows"
        context_sentence: "The sky reveals its secret."
      - word: "possess"
        definition: "to have or own"
        context_sentence: "Colour is not something objects possess."

  - title: "The Burden of Choice"
    reading_level: 7
    body: >
      To be free is also to be responsible, and that is heavier than it sounds. When
      only one path lies open, no one can blame us for taking it; but when many paths
      stretch ahead, each choice becomes ours to answer for. This is why difficult
      decisions can feel like a weight, and why some people would rather be told what to
      do than face the labour of deciding. Yet it is precisely in choosing, weighing
      one good against another and living with the result, that a person grows. The
      freedom we prize and the responsibility we sometimes dread are, in the end, the
      very same thing seen from two sides.
    questions:
      - prompt: "Why can many open paths feel like a weight?"
        type: mc
        options: ["each choice becomes ours to answer for", "they are all closed", "no one is watching", "there is nothing to gain"]
        correct_index: 0
      - prompt: "Where does the writer say a person grows?"
        type: mc
        options: ["in choosing and living with the result", "in avoiding all decisions", "in being told what to do", "in waiting"]
        correct_index: 0
      - prompt: "Explain what the writer means by freedom and responsibility being 'the same thing seen from two sides'."
        type: written
    vocabulary:
      - word: "responsible"
        definition: "answerable for one's actions"
        context_sentence: "To be free is also to be responsible."
      - word: "weighing"
        definition: "carefully considering and comparing"
        context_sentence: "Weighing one good against another."
      - word: "dread"
        definition: "to fear greatly"
        context_sentence: "The responsibility we sometimes dread."

  - title: "The Silent Extinction"
    reading_level: 7
    body: >
      When a great animal disappears, the world takes notice, but most species vanish
      without a sound. Insects, frogs, and small plants slip quietly out of existence,
      unmourned and often unnamed, though each may have held some hidden use we never
      discovered. A vanished flower might have cured a disease; a lost beetle might
      have kept a pest in check. Because these losses are silent, it is easy to
      pretend they do not matter, yet together they weaken the living fabric on which
      we all depend. To protect the small and unglamorous is not sentiment but
      good sense, for we cannot value what we have already thrown away.
    questions:
      - prompt: "Why do most extinctions go unnoticed?"
        type: mc
        options: ["small species vanish quietly", "they happen very slowly only", "no one keeps records of animals", "they are reversed at once"]
        correct_index: 0
      - prompt: "What example of a hidden use does the writer give?"
        type: mc
        options: ["a flower that might have cured a disease", "a bird that could sing", "a fish that glowed", "a tree that gave shade"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'we cannot value what we have already thrown away'."
        type: written
    vocabulary:
      - word: "extinction"
        definition: "the dying out of a kind of living thing"
        context_sentence: "The silent extinction."
      - word: "unmourned"
        definition: "not grieved for"
        context_sentence: "Unmourned and often unnamed."
      - word: "fabric"
        definition: "the underlying structure of something"
        context_sentence: "They weaken the living fabric."

  - title: "The Wisdom of Doubt"
    reading_level: 7
    body: >
      There is a strength in being willing to say "I might be wrong." The person who is
      certain of everything has stopped learning, for certainty shuts the door that
      curiosity would keep open. History is crowded with confident mistakes: whole
      nations once sure the Earth was flat, wise doctors once sure that washing hands
      was needless. Doubt, used well, is not weakness but a lantern, showing us where
      our knowledge ends and inviting us to look further. This does not mean believing
      nothing; it means holding our beliefs firmly enough to act, yet loosely enough to
      change them when the evidence demands.
    questions:
      - prompt: "What does the writer say certainty does?"
        type: mc
        options: ["shuts the door that curiosity would keep open", "makes people kinder", "speeds up learning", "reveals the truth"]
        correct_index: 0
      - prompt: "What does the writer compare well-used doubt to?"
        type: mc
        options: ["a lantern", "a locked door", "a heavy chain", "a still pond"]
        correct_index: 0
      - prompt: "Explain what the writer means by holding beliefs 'firmly enough to act, yet loosely enough to change them'."
        type: written
    vocabulary:
      - word: "certainty"
        definition: "the state of being completely sure"
        context_sentence: "Certainty shuts the door."
      - word: "lantern"
        definition: "a lamp that gives light in the dark"
        context_sentence: "Doubt is a lantern."
      - word: "demands"
        definition: "requires firmly"
        context_sentence: "When the evidence demands."

  - title: "The Engine of Weather and Harvest"
    reading_level: 7
    body: >
      Rain is not the enemy of the farmer nor the friend of the fisherman by chance;
      it is part of a single engine that never rests. Water rises unseen from ocean and
      leaf, gathers into cloud, falls upon the hills, and runs back to the sea, only to
      rise again. Upon this endless circle rest the crops in the field and the water in
      the tap. When the rhythm holds, harvests are full and wells stay sweet; when it
      falters, drought or flood can follow. To waste water carelessly, then, is to
      forget how far each drop has travelled, and how many depend on its faithful
      return.
    questions:
      - prompt: "What does the passage say water does in its endless circle?"
        type: mc
        options: ["rises, forms cloud, falls, and returns to the sea", "stays in the ocean", "turns to stone", "vanishes forever"]
        correct_index: 0
      - prompt: "What rests upon this circle?"
        type: mc
        options: ["the crops and the water in the tap", "only the fish", "the wind", "the stars"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'how far each drop has travelled'."
        type: written
    vocabulary:
      - word: "engine"
        definition: "a system that produces continuous action"
        context_sentence: "Part of a single engine that never rests."
      - word: "endless"
        definition: "having no end"
        context_sentence: "This endless circle."
      - word: "faithful"
        definition: "reliable and unfailing"
        context_sentence: "How many depend on its faithful return."

  - title: "The Cost of Silence"
    reading_level: 7
    body: >
      Sometimes the greatest harm is done not by those who act wrongly but by those who
      say nothing. When a person is treated unfairly and the bystanders look away, the
      silence itself becomes a kind of permission. It takes real courage to speak up,
      for the one who objects risks becoming a target too. Yet history remembers with
      gratitude the few who refused to stay quiet, whose single voice gave others the
      courage to add their own. To notice a wrong and say nothing is easy and
      comfortable; to name it plainly, even alone, is how the comfortable silence is at
      last broken.
    questions:
      - prompt: "What does the writer say silence can become?"
        type: mc
        options: ["a kind of permission", "a form of kindness", "a way to help", "a hidden strength"]
        correct_index: 0
      - prompt: "Why does speaking up take courage?"
        type: mc
        options: ["the one who objects risks becoming a target", "it is against the law", "no one ever listens", "it costs money"]
        correct_index: 0
      - prompt: "Explain what the writer means by a single voice giving 'others the courage to add their own'."
        type: written
    vocabulary:
      - word: "bystanders"
        definition: "people who are present but do not take part"
        context_sentence: "The bystanders look away."
      - word: "permission"
        definition: "consent or approval to do something"
        context_sentence: "The silence becomes a kind of permission."
      - word: "objects"
        definition: "expresses disagreement or opposition"
        context_sentence: "The one who objects risks becoming a target."

  - title: "The Architecture of the Ant"
    reading_level: 7
    body: >
      No single ant is clever, yet an ant colony behaves as though it possesses a mind
      of its own. Following simple rules and faint chemical trails, thousands of tiny
      workers build sprawling nests with tunnels, nurseries, and even chambers to farm
      fungus for food. No architect draws a plan, and no ruler gives commands; the
      order arises from countless small actions added together. Scientists study these
      colonies to understand how complex behaviour can emerge from simple parts, a
      question that reaches from the anthill to the human city. In the humble ant lies
      a lesson: that great things are often built not by one grand mind but by many
      willing hands.
    questions:
      - prompt: "How do the ants build without a plan?"
        type: mc
        options: ["order arises from many small actions", "one ant commands the rest", "they copy other animals", "they work by chance alone"]
        correct_index: 0
      - prompt: "Why do scientists study ant colonies?"
        type: mc
        options: ["to see how complex behaviour emerges from simple parts", "to train the ants", "to collect the fungus", "to measure the tunnels"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'great things are built by many willing hands'."
        type: written
    vocabulary:
      - word: "colony"
        definition: "a large group of the same creatures living together"
        context_sentence: "An ant colony behaves as though it has a mind."
      - word: "sprawling"
        definition: "spreading out over a large area"
        context_sentence: "Sprawling nests with tunnels."
      - word: "emerge"
        definition: "to come into being or appear"
        context_sentence: "How complex behaviour can emerge from simple parts."

  - title: "The Value of Rest"
    reading_level: 7
    body: >
      In a world that praises busyness, rest is often mistaken for laziness, yet
      nothing could be further from the truth. The body repairs itself in sleep, the
      mind sorts and stores what it has learned, and even fields left fallow for a
      season return richer than before. Great ideas rarely arrive to an exhausted
      mind; they surface in the quiet moments, on a walk or in the pause between
      efforts. To rest well is not to abandon our work but to prepare for it, for the
      bow that is never unstrung will one day lose its spring. Those who honour rest
      are not the enemies of achievement but its wisest servants.
    questions:
      - prompt: "What does the body do during sleep?"
        type: mc
        options: ["repairs itself", "grows colder", "stops all activity", "forgets everything"]
        correct_index: 0
      - prompt: "When does the writer say great ideas often surface?"
        type: mc
        options: ["in quiet moments and pauses", "only under pressure", "while rushing", "never"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'the bow that is never unstrung will lose its spring'."
        type: written
    vocabulary:
      - word: "fallow"
        definition: "left unplanted so the soil can recover"
        context_sentence: "Fields left fallow for a season."
      - word: "surface"
        definition: "to come up or appear"
        context_sentence: "They surface in the quiet moments."
      - word: "unstrung"
        definition: "with the tension released"
        context_sentence: "The bow that is never unstrung."

  - title: "The Promise of Vaccines"
    reading_level: 7
    body: >
      Few discoveries have saved as many lives as the vaccine, yet its idea is
      strikingly simple. By showing the body a harmless trace of a disease, a vaccine
      teaches the immune system to recognise the true enemy before it ever strikes, so
      that the real illness, when it comes, is defeated in hours instead of weeks.
      Diseases that once emptied villages have, through patient science, been driven to
      the edge of extinction. This protection grows stronger still when many people
      share it, for a disease that finds no one to infect cannot spread. In the tiny
      drop of a vaccine lies one of the quiet triumphs of human cooperation.
    questions:
      - prompt: "How does a vaccine protect the body?"
        type: mc
        options: ["it teaches the immune system to recognise the disease", "it makes the body warmer", "it removes all germs from the air", "it replaces the blood"]
        correct_index: 0
      - prompt: "Why does protection grow stronger when many share it?"
        type: mc
        options: ["a disease that finds no one to infect cannot spread", "vaccines work only in crowds", "it becomes cheaper", "the germs grow weaker with age"]
        correct_index: 0
      - prompt: "Explain what the writer means by a vaccine being 'a quiet triumph of human cooperation'."
        type: written
    vocabulary:
      - word: "immune"
        definition: "able to resist a particular disease"
        context_sentence: "It teaches the immune system."
      - word: "trace"
        definition: "a very small amount"
        context_sentence: "A harmless trace of a disease."
      - word: "triumphs"
        definition: "great victories or achievements"
        context_sentence: "One of the quiet triumphs of human cooperation."

  - title: "The Reach of a Teacher"
    reading_level: 7
    body: >
      A teacher's work is strange, for its results ripen long after the lesson ends and
      often far from sight. The patient word offered to a discouraged child, the
      standard held high when it would have been easier to lower it, may bear fruit in
      a life the teacher never sees complete. Every doctor, every engineer, every
      careful parent was first a pupil shaped by someone who believed they could learn.
      This is why the influence of a good teacher can never be fully measured; it
      travels forward through the years, from one mind to the next, long after the
      teacher's own name is forgotten. To teach well is to plant a shade tree under
      which one may never sit.
    questions:
      - prompt: "Why are a teacher's results hard to see?"
        type: mc
        options: ["they ripen long after the lesson ends", "they never appear", "they happen instantly", "only exams reveal them"]
        correct_index: 0
      - prompt: "What was every doctor and engineer first?"
        type: mc
        options: ["a pupil shaped by a teacher", "a famous inventor", "a natural genius", "a stranger"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'to teach well is to plant a shade tree under which one may never sit'."
        type: written
    vocabulary:
      - word: "ripen"
        definition: "to become fully developed"
        context_sentence: "Its results ripen long after the lesson."
      - word: "discouraged"
        definition: "having lost confidence or hope"
        context_sentence: "Offered to a discouraged child."
      - word: "influence"
        definition: "the power to affect others"
        context_sentence: "The influence of a good teacher."

  - title: "The Restless Atom"
    reading_level: 7
    body: >
      Everything you can touch, the desk, the air, your very hand, is built from
      particles far too small to see, called atoms. Though a single atom is almost
      entirely empty space, the tireless dance of its parts gives matter its strength
      and shape. Arrange these atoms one way and you have soft, dark coal; arrange the
      very same kind another way and you have a diamond hard enough to cut steel. That
      the everyday world hides such secrets inside its smallest pieces astonished the
      scientists who first glimpsed it. It reminds us that the ordinary, looked at
      closely enough, is never ordinary at all.
    questions:
      - prompt: "What are all touchable things built from?"
        type: mc
        options: ["atoms too small to see", "invisible waves of sound", "drops of water", "grains of light"]
        correct_index: 0
      - prompt: "What example shows arrangement matters?"
        type: mc
        options: ["the same atoms form coal or diamond", "atoms turn to gold", "atoms disappear", "atoms make only metal"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'the ordinary, looked at closely, is never ordinary at all'."
        type: written
    vocabulary:
      - word: "particles"
        definition: "extremely small pieces of matter"
        context_sentence: "Built from particles far too small to see."
      - word: "tireless"
        definition: "never stopping or growing weary"
        context_sentence: "The tireless dance of its parts."
      - word: "glimpsed"
        definition: "saw briefly or for the first time"
        context_sentence: "The scientists who first glimpsed it."

  - title: "The Weight of a Promise"
    reading_level: 7
    body: >
      A promise is only a handful of words, yet it can bind us more tightly than any
      chain. When we give our word, we hand another person the right to expect
      something of us, and to build their own plans upon our reliability. This is why a
      broken promise wounds so deeply: it is not merely a task left undone but a trust
      betrayed. Those known for keeping their word gain a quiet power, for people will
      lean on them in matters great and small. To promise less and deliver it fully is
      worth far more than to promise the world and vanish. In the end, our reputation
      is simply the sum of the promises we have kept.
    questions:
      - prompt: "Why does a broken promise wound deeply?"
        type: mc
        options: ["it is a trust betrayed, not just a task undone", "it wastes money", "it takes a long time", "it is against the law"]
        correct_index: 0
      - prompt: "What does the writer say our reputation is?"
        type: mc
        options: ["the sum of the promises we have kept", "how much we own", "how loudly we speak", "how many friends we have"]
        correct_index: 0
      - prompt: "Explain what the writer means by 'to promise less and deliver it fully'."
        type: written
    vocabulary:
      - word: "bind"
        definition: "to tie or hold firmly"
        context_sentence: "It can bind us more tightly than any chain."
      - word: "reliability"
        definition: "the quality of being dependable"
        context_sentence: "To build their plans upon our reliability."
      - word: "betrayed"
        definition: "broken faith with; let down"
        context_sentence: "A trust betrayed."
